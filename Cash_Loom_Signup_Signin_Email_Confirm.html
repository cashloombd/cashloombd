 if(discount>sub){toast('ছাড় সাবটোটালের বেশি হতে পারে না।');return}if(paid>total){toast('প্রাপ্ত টাকা মোট বিলের বেশি হতে পারে না।');return}if(paid<total&&!customerId){toast('বাকি বিক্রির জন্য আগে একজন কাস্টমার নির্বাচন করুন।');return}
 for(const x of cart){const p=db.products.find(p=>p.id===x.id);if(!p||p.stock<x.qty){toast('স্টক পরিবর্তিত হয়েছে। কার্ট আবার যাচাই করুন।');return}if(['pharmacy','grocery'].includes(db.settings.industryType)){const batches=(db.industryRecords.stockLots||[]).filter(l=>l.kind===db.settings.industryType&&l.branchId===activeBranchId&&l.productId===p.id);if(batches.length){const eligible=batches.filter(l=>l.expiry>=today()).reduce((a,l)=>a+Number(l.qtyRemaining||0),0);if(eligible<x.qty){toast('মেয়াদোত্তীর্ণ বা অপর্যাপ্ত Batch Stock।');return}}}}
 const lines=cart.map(x=>({...x,lineTotal:x.qty*x.price}));for(const line of lines){const p=db.products.find(p=>p.id===line.id);line.lotAllocations=consumeIndustryLots(line.id,line.qty);p.stock-=line.qty;p.branchStocks=p.branchStocks||{};p.branchStocks[activeBranchId]=p.stock}
 const costTotal=lines.reduce((a,x)=>a+x.cost*x.qty,0),sale={id:uid(),invoice:'INV-'+Date.now().toString().slice(-8),date:today(),createdAt:Date.now(),branchId:activeBranchId,employeeId:document.getElementById('posEmployee')?.value||'',customerId,items:lines,subtotal:sub,discount,total,paid,paymentMethod:method,profit:lines.reduce((a,x)=>a+(x.price-x.cost)*x.qty,0)-discount,costTotal};
 db.sales.push(sale);if(paid>0)launchMoney('sale-paid',sale.id,activeBranchId,method,paid,'in',sale.date,'POS sale '+sale.invoice);
 launchAudit('sale','invoice',sale.id,`${sale.invoice} · ${money(total)} · ${launchInvoiceStatus(Math.max(0,total-paid),paid)}`);
 save();cart=[];render();toast('বিক্রি সফলভাবে সংরক্ষণ হয়েছে।');askReceipt(sale.id);
}

function salesHistoryPage(){
 const allSales=inBranch(db.sales).filter(s=>s.status!=='void').slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))||Number(b.createdAt||0)-Number(a.createdAt||0));
 const lifetimeNet=allSales.reduce((a,s)=>a+Math.max(0,Number(s.total||0)-launchSaleReturnTotal(s.id)),0);
 const lifetimeUnits=allSales.reduce((a,s)=>a+(s.items||[]).reduce((b,it)=>b+Number(it.qty||0),0),0);
 const lifetimeDue=allSales.reduce((a,s)=>a+launchSaleDue(s),0);
 const q=String(cashLoomSalesHistory.query||'').trim().toLowerCase();
 const from=cashLoomSalesHistory.from||'',to=cashLoomSalesHistory.to||'',method=cashLoomSalesHistory.method||'all',status=cashLoomSalesHistory.status||'all';
 const rows=[];let matchedInvoices=new Set(),matchedUnits=0,matchedValue=0;
 for(const sale of allSales){
  if(from&&String(sale.date||'')<from)continue;if(to&&String(sale.date||'')>to)continue;
  const due=launchSaleDue(sale),paid=launchSalePaid(sale);
  if(status==='unpaid'&&!(due>0&&paid<=0))continue;
  if(status==='partial'&&!(due>0&&paid>0))continue;
  if(status==='paid'&&due>0)continue;
  if(status==='cash'&&!(sale.saleType==='cash'||(sale.saleType==null&&!sale.customerId&&due<=0)))continue;
  if(method!=='all'&&String(sale.paymentMethod||'Cash')!==method)continue;
  const customer=sale.customerId?db.customers.find(c=>c.id===sale.customerId):null;
  const customerLabel=customer?.name||'নগদ / Walk-in';
  const employee=db.employees.find(x=>x.id===sale.employeeId)?.name||'মালিক / নির্দিষ্ট নয়';
  const invoiceText=[sale.invoice,customerLabel,customer?.phone||'',sale.paymentMethod||'Cash',employee].join(' ').toLowerCase();
  const items=(sale.items||[]);
  let saleHasMatch=false;
  items.forEach((it,index)=>{
   const product=db.products.find(p=>p.id===(it.id||it.productId));
   const productName=it.name||product?.name||'পণ্য';
   const sku=product?.sku||'';
   const lineText=[invoiceText,productName,sku,it.category||''].join(' ').toLowerCase();
   if(q&&!lineText.includes(q))return;
   saleHasMatch=true;
   const qty=Number(it.qty||0),price=Number(it.price||0),lineTotal=Number(it.lineTotal??qty*price);
   matchedUnits+=qty;matchedValue+=lineTotal;matchedInvoices.add(sale.id);
   const time=fmtTime(sale.transactionAt||sale.createdAt);
   const itemReturn=(db.saleReturns||[]).filter(r=>r.saleId===sale.id&&r.status!=='void').flatMap(r=>r.items||[]).filter(x=>x.lineIndex===index).reduce((a,x)=>a+Number(x.qty||0),0);
   rows.push(`<tr><td><b>${fmtDate(sale.date)}</b><div class="table-sub">${time}</div></td><td><b>${esc(sale.invoice||'—')}</b><div class="table-sub">${esc(branchName(sale.branchId))}</div></td><td><b>${esc(productName)}</b><div class="table-sub">${esc(sku||it.category||'SKU নেই')}</div></td><td>${qty} ${esc(product?.unit||'ইউনিট')}${itemReturn?`<div class="table-sub negative">রিটার্ন ${itemReturn}</div>`:''}</td><td>${money(price)}</td><td><b>${money(lineTotal)}</b></td><td>${esc(customerLabel)}<div class="table-sub">${esc(customer?.phone||'')}</div></td><td>${esc(sale.paymentMethod||'Cash')}</td><td>${launchStatusBadge(due,paid)}</td><td><div class="order-actions"><button class="btn small" data-action="print-sale" data-id="${sale.id}">রসিদ</button><button class="btn small" data-launch-action="sale-return" data-id="${sale.id}">রিটার্ন</button><button class="btn small danger" data-launch-action="delete-sale" data-id="${sale.id}">ডিলিট</button></div></td></tr>`);
  });

 let rangeStart=now,rangeEnd=now;
 if(cashLoomDashRange==='7')rangeStart=shiftDate(now,-6);

 const kpi=(icon,label,value,sub,kind,buttonText,action,target)=>`<article class="cldash-card ${kind||''}"><div class="cldash-card-top"><span class="cldash-label">${label}</span><span class="cldash-icon"><img src="${icon}" alt="${esc(label)}" width="40" height="40"></span></div><strong class="cldash-value">${value}</strong><small class="cldash-sub">${sub}</small>${buttonText?`<button class="btn ${kind==='green'?'soft':''}" ${action}="${target}">${buttonText}</button>`:''}</article>`;
 const listRow=(icon,title,sub,value)=>`<div class="cldash-list-row"><div class="cldash-list-copy"><b>${esc(title)}</b><small>${esc(sub||'')}</small></div>${value?`<strong>${value}</strong>`:''}</div>`;
 const alertRow=(icon,title,sub,target,kind='')=>`<div class="cldash-alert"><div class="cldash-alert-copy"><b>${title}</b><small>${sub}</small></div>${target?`<button class="cldash-link" data-go="${target}">দেখুন →</button>`:''}</div>`;
 const businessName=esc(db.settings.businessName||'আপনার ব্যবসা');
 return `<div class="cldash">
  <section class="cldash-toolbar">
   <div class="cldash-title"><div class="cldash-eyebrow">CASH LOOM · BUSINESS OVERVIEW</div><h1>ড্যাশবোর্ড</h1><p>${businessName} · ${esc(branch?.name||'প্রধান শাখা')} · আপনার ব্যবসার গুরুত্বপূর্ণ হিসাব এক নজরে।</p></div>
   <div class="cldash-controls">
    <select class="cldash-select" id="clDashPeriod" aria-label="রিপোর্টের সময়সীমা">
     <option value="7" ${cashLoomDashRange==='7'?'selected':''}>শেষ ৭ দিন</option>
     <option value="30" ${cashLoomDashRange==='30'?'selected':''}>শেষ ৩০ দিন</option>
     <option value="90" ${cashLoomDashRange==='90'?'selected':''}>শেষ ৯০ দিন</option>
     <option value="month" ${cashLoomDashRange==='month'?'selected':''}>এই মাস</option>
     <option value="year" ${cashLoomDashRange==='year'?'selected':''}>এই বছর</option>
     <option value="custom" ${cashLoomDashRange==='custom'?'selected':''}>নিজে তারিখ দিন</option>
    </select>
    <span class="cldash-date">${rangeLabel}</span>
    ${cashLoomDashRange==='custom'?`<div class="cldash-custom-dates"><input type="date" id="clDashFrom" value="${esc(rangeStart)}" max="${now}" aria-label="শুরুর তারিখ"><input type="date" id="clDashTo" value="${esc(rangeEnd)}" max="${now}" aria-label="শেষ তারিখ"></div>`:''}
    <button class="btn" type="button" data-cldash-print>প্রিন্ট</button>
    <button class="btn primary" type="button" data-go="analytics">সব শাখার রিপোর্ট</button>
   </div>
  </section>

  <section class="cldash-layout">
   <main class="cldash-main">
    <div class="cldash-kpis">
     ${kpi(dashboardIcons.cash,'CASH & BANK',money(totalBalance),'সব রেকর্ডকৃত অ্যাকাউন্টের বর্তমান ব্যালেন্স','green','শুরুর ব্যালেন্স','data-launch-action','opening-balance')}
     ${kpi(dashboardIcons.customer,'CUSTOMERS',format(activeCustomers.length),'সক্রিয় কাস্টমার','blue','কাস্টমার যোগ','data-action','add-customer')}
     ${kpi(dashboardIcons.products,'PRODUCTS',format(activeProducts.length),'সক্রিয় পণ্য','violet','পণ্য যোগ','data-action','add-product')}
     ${kpi(dashboardIcons.receivable,'RECEIVABLE',money(receivable),`${unpaid.length}টি পরিশোধ হয়নি · ${partial.length}টি আংশিক বাকি`,'green','বাকি আদায় করুন','data-go','customers')}
     ${kpi(dashboardIcons.sales,'TODAY’S SALES',money(todaySales.reduce((a,s)=>a+Math.max(0,Number(s.total||0)-launchSaleReturnTotal(s.id)),0)),`${todaySales.length}টি ইনভয়েস · ${format(todaySales.reduce((a,s)=>a+(s.items||[]).reduce((b,it)=>b+Number(it.qty||0),0),0))} ইউনিট বিক্রি`,'green','বিক্রয় ইতিহাস দেখুন','data-go','salesHistory')}
     ${kpi(dashboardIcons.profit,'NET PROFIT',money(periodNet),'নির্বাচিত সময়ে আনুমানিক গ্রস প্রফিট − ব্যবসার খরচ','green','বিস্তারিত হিসাব','data-go','analytics')}
    </div>

    <section class="cldash-panel cldash-chart-panel">
     <div class="cldash-panel-head"><div><h2>Revenue vs Expense</h2><p>${rangeLabel} · Return-adjusted sales বনাম Business Expense</p></div><button class="cldash-link" data-go="analytics">বিস্তারিত রিপোর্ট →</button></div>
     <div class="cldash-chart-summary"><div class="cldash-amounts"><span class="rev">● বিক্রি: ${money(periodRevenue)}</span> &nbsp; <span class="exp">● খরচ: ${money(periodExpense)}</span></div><div class="cldash-chart-net"><small>প্রাথমিক নেট ফলাফল</small><b>${money(periodNet)}</b></div></div>
     <div class="cldash-bars" role="img" aria-label="নির্বাচিত সময়ের বিক্রি ও খরচের তুলনা">
      ${dateBuckets.map(d=>`<div class="cldash-bar-group" title="${fmtDate(d.from)}${d.to!==d.from?' — '+fmtDate(d.to):''} · বিক্রি ${money(d.sales)} · খরচ ${money(d.expense)}"><div class="cldash-bar revenue" style="height:${Math.max(d.sales>0?2:0,d.sales/maxBar*100)}%"></div><div class="cldash-bar expense" style="height:${Math.max(d.expense>0?2:0,d.expense/maxBar*100)}%"></div><small>${d.label}</small></div>`).join('')}
     </div>
     <div class="cldash-chart-legend"><span><i style="background:#19aa6d"></i> বিক্রি</span><span><i style="background:#e76570"></i> ব্যবসার খরচ</span></div>
    </section>

    <section class="cldash-lower">
     <div class="cldash-panel"><div class="cldash-panel-head"><div><h2>সাম্প্রতিক বিক্রি</h2><p>সর্বশেষ ৫টি ইনভয়েস</p></div><button class="cldash-link" data-go="reports">সব দেখুন →</button></div>
      ${recent.length?`<div class="list">${recent.map(s=>{const net=Math.max(0,Number(s.total||0)-launchSaleReturnTotal(s.id)),due=launchSaleDue(s),paid=launchSalePaid(s);return `<div class="dash-recent-row"><div class="dash-recent-main"><b>${esc(s.invoice||'Invoice')}</b><small>${esc(customerName(s.customerId))} · ${fmtDateTime(s.date,s.transactionAt||s.createdAt)}</small></div><div class="dash-recent-amount"><b>${money(net)}</b><span class="badge ${due>0?(paid>0?'warn':'danger'):''}">${due>0?(paid>0?'আংশিক বাকি':'বাকি আছে'):'পরিশোধিত'}</span></div></div>`}).join('')}</div>`:empty('এখনো কোনো বিক্রি রেকর্ড হয়নি। POS থেকে প্রথম বিক্রি করুন।')}
     </div>
     <div class="cldash-panel"><div class="cldash-panel-head"><div><h2>Customer Due Overview</h2><p>কাস্টমারের পাওনা পরিস্থিতি</p></div><button class="cldash-link" data-go="customers">বাকি দেখুন →</button></div>
      <div class="cldash-mini-grid"><div class="cldash-mini-stat"><b>${unpaid.length}</b><small>পরিশোধ হয়নি</small></div><div class="cldash-mini-stat"><b>${partial.length}</b><small>আংশিক</small></div><div class="cldash-mini-stat"><b>${paid.length}</b><small>পরিশোধিত ইনভয়েস</small></div></div>
      ${topCustomers.length?topCustomers.map(x=>listRow('♙',x.c.name,x.c.phone||'ফোন নম্বর নেই',money(x.due))).join(''):'<div class="cldash-empty">কোনো Active কাস্টমারের বাকি নেই।</div>'}${archivedCustomerDue>0?`<div class="cldash-note">Archived কাস্টমারের পুরোনো পাওনা মোট Receivable-এ অন্তর্ভুক্ত: ${money(archivedCustomerDue)}</div>`:''}
     </div>
    </section>

function launchDeleteSale(id){
 const sale=db.sales.find(x=>x.id===id&&x.branchId===activeBranchId&&x.status!=='void');
 if(!sale)return;
 // Keep ledger allocations intact: do not delete an invoice referenced by an active return.
 const activeReturns=(db.saleReturns||[]).filter(r=>r.saleId===sale.id&&r.status!=='void');
 if(activeReturns.length){toast('এই ইনভয়েসে Active Return আছে। আগে Sales Return বাতিল করুন, তারপর ইনভয়েস Delete করতে পারবেন।');return}
 // Customer receipts may have been allocated to this invoice, either explicitly or FIFO.
 if(sale.customerId){
  const linkedPayments=(db.customerPayments||[]).filter(p=>p.customerId===sale.customerId&&p.status!=='void').filter(p=>{
   if(Array.isArray(p.allocations)&&p.allocations.length)return p.allocations.some(a=>a.saleId===sale.id);
   return true; // Legacy/FIFO receipts can be reallocated when invoice history changes.
  });
  if(linkedPayments.length){toast('এই Customer-এর Active Due Collection আছে। হিসাবের Allocation অক্ষত রাখতে আগে সংশ্লিষ্ট Payment রেকর্ড যাচাই/বাতিল করুন।');return}
 }
 const batchManaged=['grocery','pharmacy'].includes(db.settings.industryType);
 const restorePlan=[];
 for(const item of (sale.items||[])){
  const product=db.products.find(p=>p.id===(item.id||item.productId));
  const qty=Number(item.qty||0);
  if(!product||!Number.isFinite(qty)||qty<=0){toast('বিক্রির Product/Quantity যাচাই করা যায়নি। নিরাপদে Delete বন্ধ রাখা হয়েছে।');return}
  const allocations=Array.isArray(item.lotAllocations)?item.lotAllocations:[];
  const lots=[];
  if(allocations.length){
   for(const a of allocations){
    const lot=(db.industryRecords?.stockLots||[]).find(l=>l.id===a.lotId&&l.branchId===sale.branchId&&l.productId===product.id);
    const lotQty=Number(a.qty||0);
    if(!lot||!Number.isFinite(lotQty)||lotQty<=0){toast('এই বিক্রির Batch allocation পাওয়া যায়নি। ভুল Stock যোগ ঠেকাতে Delete বন্ধ রাখা হয়েছে।');return}
    lots.push({lot,qty:lotQty});
   }
  }else if(batchManaged){
   const trackedLots=(db.industryRecords?.stockLots||[]).filter(l=>l.branchId===sale.branchId&&l.productId===product.id&&l.kind===db.settings.industryType);
   if(trackedLots.length){toast('এই পুরোনো বিক্রির Batch allocation সংরক্ষিত নেই। Stock ভুল হওয়ার ঝুঁকি থাকায় Delete করা যাচ্ছে না।');return}
  }
  const variantId=item.variantId||'';
  const variant=variantId?(db.industryRecords?.variants||[]).find(v=>v.id===variantId):null;
  if(variantId&&!variant){toast('বিক্রির Variant record পাওয়া যায়নি। নিরাপদে Delete বন্ধ রাখা হয়েছে।');return}
  restorePlan.push({product,qty,lots,variant});
 }
 const invoice=sale.invoice||'এই ইনভয়েস';
 if(!confirm(`ইনভয়েস ${invoice} Delete করবেন?\n\nএই ইনভয়েসের সব পণ্য বিক্রয় ইতিহাস থেকে সরানো হবে, Stock আগের অবস্থায় ফেরত যাবে এবং প্রাথমিক পেমেন্ট Cash Ledger-এ reversal হবে। কাজটি Undo করা যাবে না।`))return;
 // Restore stock and original batch lots only after every dependency has been validated.
 restorePlan.forEach(x=>{
  x.product.stock=Number(x.product.stock||0)+x.qty;
  x.product.branchStocks=x.product.branchStocks||{};
  x.product.branchStocks[sale.branchId]=x.product.stock;
  x.lots.forEach(a=>{a.lot.qtyRemaining=Number(a.lot.qtyRemaining||0)+a.qty});
  if(x.variant)x.variant.qty=Number(x.variant.qty||0)+x.qty;
 });
 db.sales=db.sales.filter(x=>x.id!==sale.id);
 launchReverseMoney('sale-paid',sale.id,'Sale deleted '+invoice);
 launchAudit('delete','sale',sale.id,`${invoice} · ${money(sale.total)} · Stock restored`);
 save();render();toast(`ইনভয়েস ${invoice} Delete হয়েছে; Stock ও Cash Ledger সমন্বয় করা হয়েছে।`);
}

function launchVoidSaleReturn(id){
 const r=db.saleReturns.find(x=>x.id===id&&x.branchId===activeBranchId);if(!r||r.status==='void')return;
 if(!confirm('এই Sales Return বাতিল করবেন? Return-এর stock/cash effect সম্ভব হলে reverse হবে এবং মূল invoice পুনরায় হিসাব হবে।'))return;
 const entry=(r.items||[])[0],sale=db.sales.find(s=>s.id===r.saleId),product=entry&&db.products.find(p=>p.id===entry.productId);
 if(entry?.restock){
  if(!product)throw new Error('Return product পাওয়া যায়নি; reversal বন্ধ রাখা হয়েছে।');
  if(Number(product.stock||0)<Number(entry.qty||0))throw new Error('Return-এর পণ্য থেকে কিছু Stock ইতিমধ্যে বিক্রি/ব্যবহৃত হয়েছে। নিরাপদে Return বাতিল করা যাচ্ছে না।');
  const plans=entry.lotsRestored||[];
  for(const x of plans){const lot=db.industryRecords.stockLots.find(l=>l.id===x.lotId);if(!lot||Number(lot.qtyRemaining||0)<Number(x.qty||0))throw new Error('Return-এর Batch Stock থেকে কিছু ব্যবহার হয়ে গেছে। Return বাতিলের আগে Batch Ledger যাচাই করুন।')}
  if(entry.newReturnLotId){const lot=db.industryRecords.stockLots.find(l=>l.id===entry.newReturnLotId);if(!lot||Number(lot.qtyRemaining||0)<Number(entry.qty||0))throw new Error('Customer-return Batch থেকে কিছু বিক্রি হয়েছে; নিরাপদে বাতিল করা যাচ্ছে না।')}
  product.stock=Number(product.stock||0)-Number(entry.qty||0);product.branchStocks=product.branchStocks||{};product.branchStocks[activeBranchId]=product.stock;
  plans.forEach(x=>{const lot=db.industryRecords.stockLots.find(l=>l.id===x.lotId);lot.qtyRemaining=Number(lot.qtyRemaining||0)-Number(x.qty||0)});
  if(entry.newReturnLotId){const lot=db.industryRecords.stockLots.find(l=>l.id===entry.newReturnLotId);lot.qtyRemaining=Number(lot.qtyRemaining||0)-Number(entry.qty||0)}
  if(entry.itemsVariantId||entry.variantId){const v=db.industryRecords.variants.find(v=>v.id===(entry.itemsVariantId||entry.variantId));if(v)v.qty=Math.max(0,Number(v.qty||0)-Number(entry.qty||0))}
  if(sale){const soldLine=sale.items?.[entry.lineIndex];if(soldLine?.variantId){const v=db.industryRecords.variants.find(v=>v.id===soldLine.variantId);if(v)v.qty=Math.max(0,Number(v.qty||0)-Number(entry.qty||0))}}
 }
 r.status='void';r.voidedAt=Date.now();launchReverseMoney('sale-return',r.id,'Sales return void '+r.returnNo);launchAudit('void','sales_return',r.id,r.returnNo);save();render();toast('Sales Return বাতিল হয়েছে; Due, Stock ও Cash Ledger পুনরায় হিসাব হয়েছে।');
}
function launchDeleteSaleReturn(id){
 const r=db.saleReturns.find(x=>x.id===id&&(x.branchId||MAIN_BRANCH_ID)===activeBranchId);
 if(!r)return;
 if(r.status!=='void')throw new Error('সক্রিয় Return সরাসরি Delete করা যাবে না। আগে Return বাতিল করুন।');
 if(!confirm(`বাতিল Sales Return ${r.returnNo||''} ইতিহাস থেকে স্থায়ীভাবে Delete করবেন?\n\nশুধু Return History থেকে রেকর্ডটি সরবে। Cash Ledger reversal ও Audit History হিসাবের প্রমাণ হিসেবে রাখা হবে।`))return;
 db.saleReturns=db.saleReturns.filter(x=>x.id!==r.id);
 launchAudit('delete','sales_return',r.id,`${r.returnNo||'Sales Return'} · voided return removed from history; ledger reversal retained`);
 save();render();toast('বাতিল Sales Return ইতিহাস থেকে Delete হয়েছে; Cash Ledger ও Audit রেকর্ড রাখা হয়েছে।');
}

function launchVoidPurchaseReturn(id){
 const r=db.purchaseReturns.find(x=>x.id===id&&x.branchId===activeBranchId);if(!r||r.status==='void')return;
 if(!confirm('এই Purchase Return বাতিল করবেন? Return stock/cash effect reverse হবে এবং Supplier Due পুনরায় হিসাব হবে।'))return;
 const p=db.products.find(x=>x.id===r.productId);if(!p)throw new Error('Product পাওয়া যায়নি; Purchase Return বাতিল করা যায়নি।');
 const plans=r.lotsRemoved||[];
 if(['grocery','pharmacy'].includes(db.settings.industryType)&&!plans.length&&db.industryRecords.stockLots.some(l=>l.productId===r.productId&&l.branchId===activeBranchId))throw new Error('পুরোনো Return-এর Batch removal plan নেই। ভুল Batch-এ stock না বাড়াতে reversal বন্ধ রাখা হয়েছে।');
 for(const x of plans){const lot=db.industryRecords.stockLots.find(l=>l.id===x.lotId);if(!lot)throw new Error('মূল Batch পাওয়া যায়নি; Return বাতিল করা যাচ্ছে না।')}
 p.stock=Number(p.stock||0)+Number(r.qty||0);p.branchStocks=p.branchStocks||{};p.branchStocks[activeBranchId]=p.stock;
 plans.forEach(x=>{const lot=db.industryRecords.stockLots.find(l=>l.id===x.lotId);lot.qtyRemaining=Number(lot.qtyRemaining||0)+Number(x.qty||0)});
 r.status='void';r.voidedAt=Date.now();launchReverseMoney('purchase-return',r.id,'Purchase return void '+r.returnNo);launchAudit('void','purchase_return',r.id,r.returnNo);save();render();toast('Purchase Return বাতিল হয়েছে; Stock, Supplier Due ও Cash Ledger পুনরায় হিসাব হয়েছে।');
}

 else if(action==='delete-employee'){const e=db.employees.find(x=>x.id===id);if(!e)return;const linked=db.sales.some(s=>s.employeeId===id)||(db.onlineOrders||[]).some(o=>o.employeeId===id);if(linked)throw new Error('এই কর্মচারীর লেনদেনের ইতিহাস আছে। স্থায়ী Delete করা যাবে না; Archive রাখুন।');if(!confirm('কর্মচারীর রেকর্ড স্থায়ীভাবে মুছবেন?'))return;db.employees=db.employees.filter(x=>x.id!==id);launchAudit('delete','employee',id,e.name);save();render();toast('কর্মচারীর রেকর্ড মুছে ফেলা হয়েছে।')}
 else if(action==='delete-sale')launchDeleteSale(id);

function cashLoomAwardPoints(customerId,points,kind,sourceId,note=''){
  points=Math.floor(Number(points||0));if(!customerId||points<=0)return null;
  const sourceKey=kind+':'+sourceId;
  if(db.loyaltyLedger.some(x=>x.sourceKey===sourceKey))return null;
  const customer=db.customers.find(x=>x.id===customerId);if(!customer)return null;
  customer.loyaltyPoints=Math.max(0,Number(customer.loyaltyPoints||0)+points);
  const rec={id:uid(),sourceKey,branchId:activeBranchId,customerId,points,kind,note,date:today(),createdAt:Date.now()};
  db.loyaltyLedger.unshift(rec);launchAudit('loyalty_award','customer',customerId,`${points} points · ${kind}`);return rec;
}
function cashLoomApplyDigitalSaleReward(sale){
  if(!db.loyaltySettings.enabled||!sale?.customerId||Number(sale.paid)<=0)return;
  if(!['bKash','Nagad','Bank','Card'].includes(launchAccountName(sale.paymentMethod)))return;
  const points=Math.floor(Number(sale.paid||0)/100*Number(db.loyaltySettings.pointsPer100Digital||0));
  cashLoomAwardPoints(sale.customerId,points,'digital-sale',sale.id,'ডিজিটাল পেমেন্টে পয়েন্ট');
}
function cashLoomApplyEarlyDueReward(customerId,allocations,payment){
  if(!db.loyaltySettings.enabled||!customerId)return;
  const earlyDays=Math.max(0,Number(db.loyaltySettings.earlyDays||7));
  const points=Math.max(0,Number(db.loyaltySettings.earlyPayPoints||0));
  for(const al of allocations||[]){
    const sale=db.sales.find(s=>s.id===al.saleId);if(!sale)continue;
    const age=(new Date(payment.date+'T12:00:00')-new Date(String(sale.date||payment.date)+'T12:00:00'))/86400000;
    if(age<0||age>earlyDays)continue;
    const due=launchSaleDue(sale);
    if(due<=0.001)cashLoomAwardPoints(customerId,points,'early-due',sale.id,'সময়ের আগে সম্পূর্ণ বাকি পরিশোধ · '+(sale.invoice||''));
  }
}
function cashLoomPointsValue(points){return Math.max(0,Number(points||0))*Math.max(0,Number(db.loyaltySettings.takaPerPoint||0));}

function recalcPos(){

  const balance=Number(cust?.loyaltyPoints||0),redeem=Math.min(balance,Math.max(0,points)),minRedeem=Math.max(1,Number(db.loyaltySettings.minRedeemPoints||50));
  const loyaltyDiscount=Math.min(Math.max(0,sub-manual),cashLoomPointsValue(redeem)),discount=manual+loyaltyDiscount,total=Math.max(0,sub-discount);
  const mode=document.getElementById('posSaleType')?.value||'cash',paidInput=document.getElementById('posPaid'),method=document.getElementById('posPaymentMethod');let paid=Math.max(0,Number(paidInput?.value||0));
  if(mode==='cash'){paid=total;if(paidInput){paidInput.value=String(total);paidInput.disabled=true}}
  else if(mode==='credit'){paid=0;if(paidInput){paidInput.value='0';paidInput.disabled=true}}
  else if(paidInput){paidInput.disabled=false;if(paid>total){paid=total;paidInput.value=String(total)}}
  if(method)method.disabled=mode==='credit';
  const paidHelp=document.getElementById('posPaidHelp');if(paidHelp)paidHelp.textContent=mode==='cash'?'নগদ বিক্রিতে পুরো বিল নেওয়া হয়েছে।':mode==='credit'?'বাকিতে বিক্রি: এখন কোনো টাকা নেওয়া হয়নি।':'আংশিক পরিশোধে এখন যত টাকা পেয়েছেন লিখুন।';
  const set=(id,val)=>{const el=document.getElementById(id);if(el)el.textContent=val};
  set('posSubtotal',money(sub));set('posDiscountShow',money(discount));set('posTotal',money(total));set('posDue',money(Math.max(0,total-paid)));
  const help=document.getElementById('posPointsHelp');if(help)help.textContent=`ব্যালেন্স ${balance} points · ছাড় ${money(loyaltyDiscount)} · ${Number(db.loyaltySettings.takaPerPoint||0).toFixed(2)} টাকা/পয়েন্ট`;

}

function cashLoomParseBanglaNumber(text){const map={'০':'0','১':'1','২':'2','৩':'3','৪':'4','৫':'5','৬':'6','৭':'7','৮':'8','৯':'9'};return String(text||'').replace(/[০-৯]/g,ch=>map[ch]||ch).replace(/,/g,'');}
function cashLoomParseVoice(){
 const raw=String(document.getElementById('clVoiceText')?.value||'').trim();if(!raw){toast('আগে কথা বলুন বা বাক্য লিখুন।');return;}
 const t=cashLoomParseBanglaNumber(raw).toLowerCase();
 const amountMatches=[...t.matchAll(/(?:৳\s*)?(\d+(?:\.\d+)?)(?:\s*(?:টাকা|taka|tk|৳))?/g)].map(m=>Number(m[1])).filter(n=>Number.isFinite(n)&&n>0&&n<1e10);
 const amount=amountMatches.length?amountMatches[amountMatches.length-1]:0;
 let type='cash_sale';
 if(/সাপ্লাইয়ার|সাপ্লায়ার|supplier/.test(t)&&/দিলাম|পেমেন্ট|paid|payment|দিয়েছি/.test(t))type='supplier_payment';
 else if(/বাকি আদায়|আদায়|পেলাম|পেয়েছি|received|collected|paid by|টাকা দিল|পরিশোধ/.test(t))type='collection';
 else if(/বাকি|ধারে|ধার|credit|on credit|took|নিল|দিয়েছি বাকিতে/.test(t))type='credit_sale';
 else if(/নগদ বিক্রি|cash sale|sold|বিক্রি করলাম|বিক্রি হলো/.test(t))type='cash_sale';
 const cust=db.customers.filter(c=>c.isActive!==false).find(c=>{const name=String(c.name||'').toLowerCase();return name&&t.includes(name)});
 const supp=db.suppliers.filter(s=>s.isActive!==false).find(s=>{const name=String(s.name||'').toLowerCase();return name&&t.includes(name)});
 document.getElementById('clVoiceType').value=type;document.getElementById('clVoiceAmount').value=amount||'';
 document.getElementById('clVoiceCustomer').value=cust?.id||'';document.getElementById('clVoiceSupplier').value=supp?.id||'';
 document.getElementById('clVoiceNote').value=raw;
 document.getElementById('clVoiceCustomerWrap').classList.toggle('hidden',type==='supplier_payment');document.getElementById('clVoiceSupplierWrap').classList.toggle('hidden',type!=='supplier_payment');
 const stat=document.getElementById('clVoiceStatus');if(stat)stat.textContent=`Draft: ${type==='credit_sale'?'বাকিতে বিক্রি':type==='collection'?'বাকি আদায়':type==='supplier_payment'?'Supplier payment':'নগদ বিক্রি'} · ${amount?money(amount):'অঙ্ক শনাক্ত হয়নি'} · ${cust?.name||supp?.name||'নাম নির্বাচন করুন'}`;
 if(!amount)toast('অঙ্ক শনাক্ত হয়নি—নিজে Amount লিখুন।');else if(type!=='supplier_payment'&&!cust&&type!=='cash_sale')toast('Customer নাম স্বয়ংক্রিয়ভাবে মেলেনি—Dropdown থেকে নির্বাচন করুন।');
}
function cashLoomCommitVoice(){
 const type=document.getElementById('clVoiceType').value,amount=Number(document.getElementById('clVoiceAmount').value),method=document.getElementById('clVoiceMethod').value,note=String(document.getElementById('clVoiceNote').value||'Voice entry').trim();
 if(!Number.isFinite(amount)||amount<=0)throw new Error('সঠিক Amount লিখুন।');const receipt='VOI-'+Date.now().toString().slice(-8);
 if(type==='collection'){
   const customerId=document.getElementById('clVoiceCustomer').value,c=db.customers.find(x=>x.id===customerId);if(!c)throw new Error('Customer নির্বাচন করুন।');
   const due=launchCustomerDue(customerId),allocations=due>0?launchOpenSaleAllocations(customerId,Math.min(due,amount)):[];
   const rec={id:uid(),branchId:activeBranchId,customerId,amount,date:today(),method,reference:'VOICE',note,allocations,advanceAmount:Math.max(0,amount-due),status:'active',createdAt:Date.now(),receiptNo:receipt,source:'voice'};
   db.customerPayments.push(rec);launchMoney('customer-payment',rec.id,activeBranchId,method,amount,'in',today(),'Voice collection '+receipt);launchAudit('voice_collection','customer',customerId,`${money(amount)} · ${method}`);
 }else if(type==='supplier_payment'){
   const supplierId=document.getElementById('clVoiceSupplier').value,s=db.suppliers.find(x=>x.id===supplierId);if(!s)throw new Error('Supplier নির্বাচন করুন।');
   const due=launchSupplierDue(supplierId),allocations=due>0?launchOpenPurchaseAllocations(supplierId,Math.min(due,amount)):[];
   const rec={id:uid(),branchId:activeBranchId,supplierId,amount,date:today(),method,reference:'VOICE',note,allocations,advanceAmount:Math.max(0,amount-due),status:'active',createdAt:Date.now(),receiptNo:receipt,source:'voice'};
   db.supplierPayments.push(rec);launchMoney('supplier-payment',rec.id,activeBranchId,method,amount,'out',today(),'Voice supplier payment '+receipt);launchAudit('voice_supplier_payment','supplier',supplierId,`${money(amount)} · ${method}`);
 }else{
   const isCredit=type==='credit_sale',customerId=isCredit?document.getElementById('clVoiceCustomer').value:'',customer=isCredit?db.customers.find(x=>x.id===customerId):null;if(isCredit&&!customer)throw new Error('বাকিতে বিক্রির জন্য Customer নির্বাচন করুন।');
   const paid=isCredit?0:amount,sale={id:uid(),invoice:'INV-'+Date.now().toString().slice(-8),date:today(),createdAt:Date.now(),branchId:activeBranchId,employeeId:cashLoomStaffSessionId||'',customerId,items:[{id:'voice-non-stock',productId:'voice-non-stock',name:'ভয়েস এন্ট্রি · স্টকবিহীন বিক্রি',category:'অন্যান্য',qty:1,price:amount,cost:0,lineTotal:amount,nonStock:true}],subtotal:amount,discount:0,total:amount,paid,paymentMethod:isCredit?'Credit':method,profit:0,costTotal:0,voiceEntry:true,note};
   db.sales.push(sale);if(paid>0)launchMoney('sale-paid',sale.id,activeBranchId,method,paid,'in',today(),'Voice cash sale '+sale.invoice);launchAudit('voice_sale','sale',sale.id,`${money(amount)} · ${isCredit?'Credit':'Cash'}`);
 }
 db.voiceEntries.unshift({id:uid(),type,amount,method,note,date:today(),createdAt:Date.now(),status:'saved'});save();render();toast('Voice transaction সংরক্ষণ হয়েছে।');
}

function cashLoomAddPOLine(){const root=document.getElementById('clPOLines');if(!root)return;const options=db.products.filter(p=>p.isActive!==false).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');if(root.children.length>=20){toast('একটি PO-তে সর্বোচ্চ ২০টি পণ্য।');return;}root.insertAdjacentHTML('beforeend',`<div class="cl-order-line"><select name="productId[]" required>${options}</select><input name="qty[]" type="number" min="0.001" step="0.001" value="1" required placeholder="Qty"><input name="cost[]" type="number" min="0" step="0.01" value="0" required placeholder="Unit Cost"><button class="btn small danger" type="button" data-cl-action="po-remove-line">×</button></div>`);}
function cashLoomCreatePO(form){const fd=new FormData(form),ids=fd.getAll('productId[]'),qtys=fd.getAll('qty[]'),costs=fd.getAll('cost[]'),supplierId=String(fd.get('supplierId')||''),supplier=db.suppliers.find(s=>s.id===supplierId&&s.isActive!==false);if(!supplier)throw new Error('Active Supplier নির্বাচন করুন।');const items=[];for(let i=0;i<ids.length;i++){const p=db.products.find(x=>x.id===ids[i]&&x.isActive!==false),qty=Number(qtys[i]),cost=Number(costs[i]);if(!p||!Number.isFinite(qty)||qty<=0||!Number.isFinite(cost)||cost<0)throw new Error('প্রতিটি PO লাইন যাচাই করুন।');items.push({productId:p.id,name:p.name,qty,cost,receivedQty:0});}if(!items.length)throw new Error('কমপক্ষে একটি পণ্য যোগ করুন।');const date=String(fd.get('date')||today()),expectedDate=String(fd.get('expectedDate')||'');if(date>today()||expectedDate&&expectedDate<date)throw new Error('PO Date ও Expected Date যাচাই করুন।');const po={id:uid(),poNo:'PO-'+Date.now().toString().slice(-8),branchId:activeBranchId,supplierId,date,expectedDate,reference:String(fd.get('reference')||''),note:String(fd.get('note')||''),items,status:'ordered',createdAt:Date.now(),receipts:[]};db.purchaseOrders.push(po);launchAudit('create','purchase_order',po.id,po.poNo);save();closeModal();render();toast('Purchase Order তৈরি হয়েছে। Stock এখনো বাড়েনি।');}
function cashLoomPOCancel(id){const po=db.purchaseOrders.find(x=>x.id===id&&x.branchId===activeBranchId);if(!po||['received','cancelled'].includes(po.status))return;if(!confirm('এই PO Cancel করবেন? আগে Receive করা পণ্য ও Supplier Bill অপরিবর্তিত থাকবে।'))return;po.status='cancelled';po.cancelledAt=Date.now();launchAudit('cancel','purchase_order',id,po.poNo);save();render();toast('Purchase Order Cancel হয়েছে।');}
function cashLoomPODetail(id){const po=db.purchaseOrders.find(x=>x.id===id);if(!po)return;const rows=po.items.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.qty}</td><td>${x.receivedQty||0}</td><td>${Math.max(0,x.qty-(x.receivedQty||0))}</td><td>${money(x.cost)}</td><td>${money(x.qty*x.cost)}</td></tr>`).join('');openModal('Purchase Order · '+po.poNo,`Supplier: ${esc(supplierName(po.supplierId))} · Status: ${po.status}`,table(['পণ্য','Order Qty','Received','Remaining','Unit Cost','Amount'],rows)+`<div class="cl-note">${esc(po.note||'নোট নেই')}<br>PO Received করলে আলাদা Supplier Purchase Bill তৈরি হয়।</div><div class="form-actions"><button class="btn" data-close>বন্ধ</button>${!['received','cancelled'].includes(po.status)?`<button class="btn primary" data-cl-action="po-receive" data-id="${po.id}">Goods Receive</button>`:''}</div>`)}

function cashLoomAttendanceAction(id,kind){const emp=db.employees.find(e=>e.id===id&&e.isActive!==false);if(!emp)throw new Error('Active employee পাওয়া যায়নি।');let rec=db.staffAttendance.find(a=>a.employeeId===id&&a.date===today()&&a.branchId===activeBranchId&&!a.checkOut);if(kind==='in'){if(rec)throw new Error('আজ ইতোমধ্যে Check-in করা হয়েছে।');rec={id:uid(),employeeId:id,branchId:activeBranchId,date:today(),checkIn:Date.now(),checkOut:null,createdAt:Date.now()};db.staffAttendance.push(rec);launchAudit('check_in','employee',id,emp.name);}else{if(!rec)throw new Error('Open Check-in পাওয়া যায়নি।');rec.checkOut=Date.now();rec.hours=Math.max(0,(rec.checkOut-rec.checkIn)/3600000);launchAudit('check_out','employee',id,emp.name+' · '+rec.hours.toFixed(2)+'h');}save();render();toast(kind==='in'?'Check-in সংরক্ষণ হয়েছে।':'Check-out সংরক্ষণ হয়েছে।');}

function cashLoomStartRecognition(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){const st=document.getElementById('clVoiceStatus');if(st)st.textContent='এই Browser-এ Speech Recognition নেই। বাক্যটি টাইপ করুন।';toast('Voice API unavailable — manual text fallback ব্যবহার করুন।');return;}
 try{cashLoomVoiceRecognition=new SR();cashLoomVoiceRecognition.lang=cashLoomLocale();cashLoomVoiceRecognition.interimResults=true;cashLoomVoiceRecognition.maxAlternatives=3;let interim='';cashLoomVoiceRecognition.onstart=()=>{const st=document.getElementById('clVoiceStatus');if(st)st.textContent='শুনছি… কথা বলুন।';document.getElementById('clRecordBtn')?.classList.add('recording')};cashLoomVoiceRecognition.onresult=e=>{let final='';interim='';for(let i=e.resultIndex;i<e.results.length;i++){const txt=e.results[i][0].transcript;if(e.results[i].isFinal)final+=txt;else interim+=txt;}const input=document.getElementById('clVoiceText');if(input)input.value=(final||interim).trim();if(final)cashLoomParseVoice();};cashLoomVoiceRecognition.onerror=e=>{const st=document.getElementById('clVoiceStatus');if(st)st.textContent='Voice error: '+e.error+' · বাক্য টাইপ করে এগিয়ে যান।';document.getElementById('clRecordBtn')?.classList.remove('recording')};cashLoomVoiceRecognition.onend=()=>{document.getElementById('clRecordBtn')?.classList.remove('recording');const st=document.getElementById('clVoiceStatus');if(st&&st.textContent==='শুনছি… কথা বলুন।')st.textContent='Recording শেষ। Draft যাচাই করুন।'};cashLoomVoiceRecognition.start();}catch(e){toast('Microphone শুরু করা যায়নি। Browser permission পরীক্ষা করুন।');}}

// Case-insensitive phrase maps; long phrases are always matched before short words.
function cashLoomBuildPhraseMatcher(map,english){
 const keys=Object.keys(map).filter(k=>k&&k.length>=2).sort((a,b)=>b.length-a.length);
 if(!keys.length)return null;
 try{return new RegExp(keys.map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),english?'giu':'gu');}
 catch(e){return null;}
}
const cashLoomBnPhraseRegex=cashLoomBuildPhraseMatcher(CASHLOOM_I18N,false);
const cashLoomEnPhraseRegex=cashLoomBuildPhraseMatcher(cashLoomEnglishPhraseMap,true);
function cashLoomPreserveCase(source,result){
 if(source===source.toUpperCase())return result.toLocaleUpperCase();
 if(source.length&&source[0]===source[0].toUpperCase())return result.charAt(0).toLocaleUpperCase()+result.slice(1);
 return result;
}
function cashLoomTranslateText(original,lang){
 const raw=String(original??'');
 if(!raw.trim())return raw;
 const lead=(raw.match(/^\s*/)||[''])[0],trail=(raw.match(/\s*$/)||[''])[0];
 let core=raw.slice(lead.length,raw.length-trail.length||undefined);
 if(!core)return raw;
 if(lang==='en'){
  if(/[\u0980-\u09FF]/.test(core)){
   core=CASHLOOM_I18N[core]||core;
   if(core===raw.trim()&&cashLoomBnPhraseRegex)core=core.replace(cashLoomBnPhraseRegex,k=>CASHLOOM_I18N[k]||k);
   core=core.replace(/[\u0980-\u09FF]+/gu,w=>CASHLOOM_WORD_I18N[w]||cashLoomBnWordMap[w]||w);
  }
 }else{
  if(/[A-Za-z]/.test(core)){
   const exact=CASHLOOM_EN_TO_BN[core]||cashLoomEnglishKeyMap[core.toLocaleLowerCase('en')];
   if(exact)core=exact;
   else{
    if(cashLoomEnPhraseRegex)core=core.replace(cashLoomEnPhraseRegex,m=>CASHLOOM_EN_TO_BN[m]||cashLoomEnglishKeyMap[m.toLocaleLowerCase('en')]||m);
    core=core.replace(/[A-Za-z][A-Za-z0-9’'&-]*/g,w=>{

 let original=cashLoomOriginalText.get(node);

 else if(last!==undefined&&current!==last){original=current;cashLoomOriginalText.set(node,original);}

function cashLoomTranslateSubtree(root,lang){

 if(root.nodeType!==Node.ELEMENT_NODE&&root!==document.body)return;

let cashLoomLangApplying=false;
let cashLoomLanguageJob=0;
function cashLoomApplyLanguage(lang,root=document.body){

 }

 if(root?.nodeType===Node.ELEMENT_NODE){elements.push(root);}
 if(root?.nodeType===Node.TEXT_NODE){textNodes.push(root);}

  const walker=document.createTreeWalker(root,NodeFilter.SHOW_ELEMENT|NodeFilter.SHOW_TEXT);

 }
 let index=0,elementIndex=0;
 const step=()=>{
  if(job!==cashLoomLanguageJob)return;
  cashLoomLangApplying=true;
  try{
   let count=0;
   while(index<textNodes.length&&count<180){cashLoomTranslateTextNode(textNodes[index++],lang);count++;}
   while(elementIndex<elements.length&&count<220){cashLoomTranslateAttributeElement(elements[elementIndex++],lang);count++;}

}

function cashLoomAddOneMonth(timestamp){

async function cashLoomVerifyOneTimeCode(planId){
 const p=CASHLOOM_PLANS[planId];if(!p)return;
 const input=document.getElementById('cashLoomOneTimeCodeInput');
 const error=document.getElementById('cashLoomOneTimeCodeError');
 const button=document.querySelector('[data-plan-action="verify-one-time"]');
 const entered=String(input?.value||'').trim().toUpperCase();
 if(!entered){
  if(error)error.textContent=cashLoomLang==='en'?'Enter the One Time Activation Code first.':'আগে Activation Code লিখুন।';
  if(input){input.setAttribute('aria-invalid','true');input.focus();}

 }
 if(button){button.disabled=true;button.textContent=cashLoomLang==='en'?'Verifying…':'যাচাই হচ্ছে…';}
 if(error)error.textContent='';
 try{
  const response=await fetch(`${CASHLOOM_API_BASE_URL.replace(/\/+$/,'')}/api/codes/redeem`,{
   method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({code:entered,planId})
  });
  let result={};try{result=await response.json()}catch(_e){}
  if(!response.ok||!result.success){
   const messages={
    400:cashLoomLang==='en'?'Invalid code format or plan. Please check your code.':'কোডের ফরম্যাট বা প্ল্যান সঠিক নয়। কোডটি আবার যাচাই করুন।',
    404:cashLoomLang==='en'?'This One Time Code is invalid. Please contact WhatsApp for a new code.':'এই কোডটি সঠিক নয়। নতুন কোড পেতে WhatsApp-এ যোগাযোগ করুন।',
    409:cashLoomLang==='en'?'This code has already been used or was issued for another plan.':'এই কোডটি ইতিমধ্যে ব্যবহার করা হয়েছে অথবা অন্য প্ল্যানের জন্য তৈরি।',
    410:cashLoomLang==='en'?'This activation code has expired. Please request a new one.':'এই Activation Code-এর মেয়াদ শেষ। নতুন কোড সংগ্রহ করুন।',

   };
   throw new Error(messages[response.status]||result.error||(cashLoomLang==='en'?'Could not verify the code. Check your internet/API connection.':'কোড যাচাই করা যায়নি। ইন্টারনেট/API সংযোগ পরীক্ষা করুন।'));
  }
  // Start the paid month from the server's exact code-redemption timestamp, not page-load or form-open time.
  const s=cashLoomPlanRecord();
  const serverRedeemedAt=cashLoomTimestamp(result.redeemedAt)||Date.now();
  s.status='active';s.planId=planId;s.activatedAt=serverRedeemedAt;s.planStartedAt=serverRedeemedAt;s.planEndsAt=cashLoomAddOneMonth(serverRedeemedAt);

 }catch(err){
  if(error)error.textContent=err.message|| (cashLoomLang==='en'?'API connection failed.':'API সংযোগ করা যাচ্ছে না।');

 }finally{

 }
}

  const p=b.dataset.page,locked=!cashLoomPlanCanPage(p)&&p!=='plans'&&p!=='profile';
  b.classList.toggle('cl-plan-locked',locked);
  b.title=locked?cashLoomPlanText('এই ফিচারের জন্য '+cashLoomPlanNeedLabel(p)+' প্ল্যান প্রয়োজন','Requires '+cashLoomPlanNeedLabel(p)+' plan'):'';
 });
}

// Product cap: only block creation; editing an existing item remains possible.
const cashLoomOriginalProductSubmit=launchProductFormSubmit;
launchProductFormSubmit=async function(form){
 const fd=new FormData(form),id=String(fd.get('id')||'');
 if(!id){
  const status=cashLoomPlanStatus(),ent=cashLoomEntitlements();
  if(status!=='trial'&&status!=='active')throw new Error('Free Trial শুরু করুন অথবা একটি Paid Plan চালু করুন।');
  const activeCount=(db.products||[]).filter(p=>p.isActive!==false).length;
  if(Number.isFinite(ent.products)&&activeCount>=ent.products)throw new Error(`আপনার ${ent.plan==='standard'?'Standard':'Premium'} প্ল্যানের ${ent.products}টি Active Product Limit পূর্ণ। বেশি পণ্যের জন্য পরের প্ল্যান নিন।`);
 }
 return cashLoomOriginalProductSubmit(form);
};

// Staff creation cap for the standard employee form.
const cashLoomOriginalSimpleForm=simpleForm;
simpleForm=function(kind,obj={}){
 if(kind==='employee'&&!obj.id){
  const status=cashLoomPlanStatus(),ent=cashLoomEntitlements();
  const count=(db.employees||[]).filter(x=>x.isActive!==false).length;
  if(status!=='trial'&&status!=='active'){toast('কর্মচারী যোগ করতে Free Trial শুরু করুন অথবা একটি Paid Plan চালু করুন।');setPage('plans');return;}
  if(count>=ent.staff){toast(ent.staff===0?'কর্মচারী সুবিধা Premium প্ল্যানে পাওয়া যাবে।':`আপনার প্ল্যানে সর্বোচ্চ ${ent.staff} জন কর্মী যোগ করা যাবে।`);setPage('plans');return;}
 }
 return cashLoomOriginalSimpleForm(kind,obj);
};

// Gate Premium/Business-only actions and CSV tools even when invoked without opening a page.
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 const action=b.dataset.action||'',launch=b.dataset.launchAction||'',cl=b.dataset.clAction||'';
 let required=0;
 if(['import-products','export-products','export-sales'].includes(action))required=2;
 if(action==='export-analytics')required=3;
 if(/return|exchange/i.test(launch)||/return|exchange/i.test(cl))required=2;
 if(!required)return;
 if(cashLoomActiveTier()<required){e.preventDefault();e.stopImmediatePropagation();const planName=required===3?'Business':'Premium';toast(cashLoomPlanText(`${planName} প্ল্যানে এই সুবিধা পাওয়া যাবে।`,`This feature is available on the ${planName} plan.`));setPage('plans');}
},true);

// Keep trial and monthly subscription clocks accurate across reloads.
cashLoomPlanRecord();
if(['trial','active'].includes(cashLoomPlanStatus()))cashLoomSchedulePlanExpiry();
const planNav=document.querySelector('.nav-list button[data-page="profile"]');
if(planNav&&!document.querySelector('.nav-btn[data-page="plans"]'))planNav.insertAdjacentHTML('beforebegin','<button class="nav-btn" data-page="plans"><span class="ico">✦</span> প্ল্যান ও সাবস্ক্রিপশন</button>');
function cashLoomSyncPlanNavLabel(){const b=document.querySelector('.nav-btn[data-page="plans"]');if(b)b.innerHTML='<span class="ico">✦</span> '+(cashLoomLang==='en'?'Plans & Subscription':'প্ল্যান ও সাবস্ক্রিপশন');}
cashLoomSyncPlanNavLabel();
document.addEventListener('change',e=>{if(e.target?.id==='clLanguageSwitcher')cashLoomSyncPlanNavLabel()},true);
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-plan-action]');if(!b)return;
 e.preventDefault();e.stopImmediatePropagation();
 if(b.dataset.planAction==='start-trial')cashLoomStartTrial();
 else if(b.dataset.planAction==='select')cashLoomSelectPlan(b.dataset.planId);
 else if(b.dataset.planAction==='verify-one-time')cashLoomVerifyOneTimeCode(b.dataset.planId);
},true);
// New businesses begin at the plan screen; no data is deleted or overwritten.
if(['trial_available','expired'].includes(cashLoomPlanStatus()))setPage('plans');
else cashLoomSyncPlanNavLocks();


// Every in-app page is private: re-check the Supabase session before rendering it.
const cashLoomSetPageBeforeAuthGuard=setPage;
setPage=function(p){
 if(p==='settings')p='profile';
 if(!cashLoomAuthReady){cashLoomPendingPage=p;return;}
 return cashLoomGuardedNavigation(p,()=>cashLoomSetPageBeforeAuthGuard(p));
};

// Initialize Supabase and protect the app until a real Auth session is confirmed.
window.addEventListener('DOMContentLoaded',async()=>{
 const loginReturn=new URLSearchParams(location.search).get('cashloom_login')==='1';
 const googleReturn=new URLSearchParams(location.search).get('cashloom_google_login')==='1';
 try{
  await initCloudStartup();
  const session=await cashLoomRequireSession();
  cashLoomAuthReady=true;
  if(session){
   cashLoomAuthRedirecting=false;
   cashLoomCloseAuthGate();
   if(loginReturn||googleReturn)history.replaceState({},'',cashLoomBasePath());
   const target=(googleReturn||loginReturn)?'dashboard':(cashLoomPendingPage||'dashboard');
   cashLoomPendingPage=null;
   document.body.classList.remove('cashloom-auth-pending');
   await setPage(target);
  }else{
   cashLoomPendingPage=null;
   cashLoomShowAuthGate();
   document.body.classList.remove('cashloom-auth-pending');
   if(!loginReturn)cashLoomRedirectToLogin();
  }
 }catch(error){
  cashLoomAuthReady=true;cloudUser=null;cashLoomPendingPage=null;
  cashLoomShowAuthGate();
  document.body.classList.remove('cashloom-auth-pending');
  if(!loginReturn)cashLoomRedirectToLogin();
  if(cloudInitError)cashLoomSetAuthMessage(cloudInitError,'error');
 }
},{once:true});
document.addEventListener('click',e=>{
 const modeBtn=e.target.closest('[data-gate-mode]');
 if(modeBtn){cloudAuthMode=modeBtn.dataset.gateMode==='signup'?'signup':'signin';cashLoomAuthGateRender();return;}
 const googleBtn=e.target.closest('[data-gate-google]');
 if(googleBtn){cloudGoogleSignIn().catch(err=>toast(cloudFriendlyError(err)));return;}
 const closeBtn=e.target.closest('[data-gate-close]');
 if(closeBtn){cashLoomCloseAuthGate();return;}
},true);


})();
</script>
