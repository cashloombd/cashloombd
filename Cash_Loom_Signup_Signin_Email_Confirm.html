.cl-mic-head h2{font-size:14px;margin:0 0 5px;color:#294238}
.cl-mic-head p{font-size:9px;color:#84968d;margin:0;line-height:1.5}
.cl-mic{width:54px;height:54px;border:0;border-radius:50%;background:linear-gradient(145deg,#27c982,#0b8054);color:#fff;font-size:23px;box-shadow:0 8px 18px #0a865332;flex:none}
.cl-mic.recording{background:linear-gradient(145deg,#ed7180,#c7445c);animation:clPulse 1.2s infinite}
@keyframes clPulse{50%{box-shadow:0 0 0 9px #ee7c8524,0 8px 18px #c7445c33}}
.cl-voice-text{display:block;width:100%;min-height:104px;border:1px solid #dfe9e3;border-radius:11px;padding:12px;background:#fbfefc;color:#243c31;outline:0;resize:vertical;font-size:12px;line-height:1.65}
.cl-voice-text:focus{border-color:#5ac792;box-shadow:0 0 0 3px #16a96d18}
.cl-note{margin-top:12px;padding:11px 13px;background:#f0faf4;border:1px solid #d9f0e2;border-radius:10px;color:#557867;font-size:9px;line-height:1.7}
.cl-api-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cl-api-grid>div{padding:12px;border:1px solid #e5eee8;background:#fbfefc;border-radius:10px;min-width:0}
.cl-api-grid b{font-size:10px;color:#315342;display:block;margin-bottom:6px}
.cl-api-grid p{font-size:9px;color:#7e9387;line-height:1.65;margin:0}
.cl-tabs{margin:13px 0;flex-wrap:wrap}
.cl-order-line{display:grid;grid-template-columns:minmax(0,1fr) 100px 110px 32px;gap:7px;align-items:center;margin:8px 0}
.cl-order-line input,.cl-order-line select,.cl-po-receive-line input{min-width:0;width:100%;border:1px solid #e4e9f1;background:#fbfcfe;border-radius:8px;padding:9px;font-size:10px;color:#40516a}
.cl-po-receive-line{display:grid;grid-template-columns:minmax(0,1fr) 95px 115px 115px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #edf1ee}
.cl-po-receive-line b{display:block;font-size:10px;color:#3a5145}
.cl-po-receive-line small{display:block;font-size:8px;color:#91a298;margin-top:4px}
.cl-staff-banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#eaf8f0;border:1px solid #d4efdf;color:#1b7750;padding:10px 13px;border-radius:10px;margin-bottom:12px;font-size:10px}
.cl-staff-mode #clVoiceFab{display:none}
.cl-insight-card{display:flex;align-items:flex-start;gap:11px;padding:13px;border:1px solid #e5eee8;background:#fbfefc;border-radius:11px;margin:8px 0}
.cl-insight-card .cl-insight-icon{width:34px;height:34px;border-radius:10px;background:#e4f7eb;color:#13955e;display:grid;place-items:center;flex:none;font-size:16px}
.cl-insight-card strong{display:block;font-size:10px;color:#355342}
.cl-insight-card p{font-size:9px;color:#83978b;line-height:1.6;margin:4px 0}
.cl-insight-card .actions{margin-left:auto;flex:none}
.cl-amount-positive{color:#0e9d65!important}.cl-amount-negative{color:#d06476!important}
@media(max-width:850px){.cl-voice-grid{grid-template-columns:1fr}.cl-api-grid{grid-template-columns:1fr}}
@media(max-width:620px){#clVoiceFab{right:14px;bottom:16px;width:54px;height:54px}.cl-order-line{grid-template-columns:minmax(0,1fr) 75px 88px 30px}.cl-po-receive-line{grid-template-columns:minmax(0,1fr) 68px 88px 88px;gap:5px}.cl-po-receive-line input{padding:7px 5px;font-size:9px}}
</style>

const fmtDateTime=(date,ts)=>`${fmtDate(date)}<div class="table-sub cl-datetime-sub">🕒 ${fmtTime(ts)} · বাংলাদেশ সময়</div>`;

const monthStart=()=>today().slice(0,7)+'-01';
const seed=()=>({version:1,settings:{businessName:'আমার ব্যবসা',owner:'ব্যবসার মালিক',phone:'',address:'ঢাকা, বাংলাদেশ',currency:'BDT',lowStock:5},products:[
{id:uid(),name:'প্রিমিয়াম টি-শার্ট',sku:'TS-001',category:'পোশাক',unit:'পিস',cost:220,price:350,stock:38,lowStock:8},
{id:uid(),name:'কটন শার্ট',sku:'SH-002',category:'পোশাক',unit:'পিস',cost:420,price:650,stock:22,lowStock:5},
{id:uid(),name:'পানির বোতল ১ লিটার',sku:'BT-003',category:'দৈনন্দিন',unit:'পিস',cost:35,price:60,stock:75,lowStock:12},

function migratePhase2(){
 db.version=2; db.settings=db.settings||{};
 if(!Array.isArray(db.branches)||!db.branches.length)db.branches=[{id:MAIN_BRANCH_ID,name:'প্রধান শাখা',code:'MAIN',phone:db.settings.phone||'',address:db.settings.address||'ঢাকা, বাংলাদেশ',createdAt:Date.now()}];
 if(!db.branches.some(b=>b.id===MAIN_BRANCH_ID))db.branches.unshift({id:MAIN_BRANCH_ID,name:'প্রধান শাখা',code:'MAIN',phone:'',address:'ঢাকা, বাংলাদেশ',createdAt:Date.now()});

 if(!db.branches.some(b=>b.id===db.settings.activeBranchId))db.settings.activeBranchId=db.branches[0].id;
 if(!Array.isArray(db.roles))db.roles=ROLE_TEMPLATES.map(r=>JSON.parse(JSON.stringify(r)));
 if(!db.automation)db.automation={lowStockEnabled:true,dueEnabled:true,dueThreshold:10000,dailyTargetEnabled:true,dailyTarget:20000,expiryEnabled:false};
 if(!Array.isArray(db.notifications))db.notifications=[];

 ['sales','purchases','expenses','customerPayments','supplierPayments'].forEach(k=>(db[k]||[]).forEach(x=>{if(!x.branchId)x.branchId=MAIN_BRANCH_ID}));

 if(!Array.isArray(db.onlineOrders))db.onlineOrders=[];if(!Array.isArray(db.activityLogs))db.activityLogs=[];
 db.version=Math.max(Number(db.version||1),5);

try{localStorage.setItem(CLOUD_CFG_KEY,JSON.stringify(cloudConfig))}catch(e){}
const canManageCloud=()=>['owner','admin','manager'].includes(cloudRole);

const save=()=>{try{db.products.forEach(p=>{p.branchStocks=p.branchStocks||{};p.branchStocks[activeBranchId]=Number(p.stock||0)});db.settings.activeBranchId=activeBranchId;localPersist();if(cloudBusinessId&&cloudUser){if(!canManageCloud()&&!canCashierCloud()){toast('এই Cloud Role-এ তথ্য পরিবর্তনের অনুমতি নেই।');return}scheduleCloudSave()}}catch(e){toast('ডেটা সংরক্ষণ করা যায়নি। Backup নিন।')}};
function makeSupabaseClient(cfg){if(!window.supabase?.createClient)throw new Error('Supabase SDK লোড হয়নি। ইন্টারনেট সংযোগ পরীক্ষা করুন।');if(!cfg?.url||!cfg?.key)throw new Error('Supabase URL ও Publishable/Anon Key দিন।');sbClient=window.supabase.createClient(cfg.url.trim(),cfg.key.trim(),{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});return sbClient}
function cloudFriendlyError(err){let m=err?.message||String(err||'Unknown error');if(/Invalid login credentials/i.test(m))return 'ইমেইল বা পাসওয়ার্ড সঠিক নয়।';if(/Email not confirmed/i.test(m))return 'ইমেইল নিশ্চিত করুন, তারপর লগইন করুন।';if(/VERSION_CONFLICT/i.test(m))return 'অন্য ব্যবহারকারী আগে ডেটা পরিবর্তন করেছেন। সর্বশেষ Cloud ডেটা লোড করা হয়েছে; আপনার স্থানীয় কপি Backup-এ রাখা হয়েছে।';if(/not allowed|permission denied|42501/i.test(m))return 'এই Role-এ এই কাজের অনুমতি নেই।';return m}
function setCloudNav(){}
function cleanStateCopy(){return JSON.parse(JSON.stringify(db))}
function scheduleCloudSave(){if(!cloudBusinessId||!cloudUser)return;cloudDirty=true;clearTimeout(cloudSaveTimer);cloudSaveTimer=setTimeout(pushCloudState,650)}
async function pushCloudState(){if(cloudSaving||!cloudDirty||!cloudBusinessId||!sbClient)return;if(!canManageCloud()&&!canCashierCloud())return;cloudSaving=true;cloudDirty=false;const snapshot=cleanStateCopy();try{const fn=canCashierCloud()?'save_cashier_state':'save_business_state';const {data,error}=await sbClient.rpc(fn,{p_business_id:cloudBusinessId,p_data:snapshot,p_expected_version:cloudVersion});if(error)throw error;cloudVersion=Number(data);cloudLastSync=new Date().toISOString();setCloudNav();}catch(err){if(/VERSION_CONFLICT/i.test(err?.message||'')){try{localStorage.setItem('byabshaos_conflict_backup_'+cloudBusinessId,JSON.stringify(snapshot));await loadCloudBusinessState(true);toast(cloudFriendlyError(err));}catch(loadErr){toast('Cloud conflict হয়েছে। স্থানীয় Backup রাখা হয়েছে; '+cloudFriendlyError(loadErr))}}else{cloudDirty=true;toast('Cloud Sync হয়নি: '+cloudFriendlyError(err))}}finally{cloudSaving=false;if(cloudDirty){clearTimeout(cloudSaveTimer);cloudSaveTimer=setTimeout(pushCloudState,400)}}}
function stopCloudRealtime(){if(cloudChannel&&sbClient){sbClient.removeChannel(cloudChannel).catch(()=>{});cloudChannel=null}}
function subscribeCloudRealtime(){stopCloudRealtime();if(!sbClient||!cloudBusinessId)return;const subscribedBusinessId=cloudBusinessId;cloudChannel=sbClient.channel('byabshaos-state-'+subscribedBusinessId).on('postgres_changes',{event:'UPDATE',schema:'public',table:'business_state',filter:'business_id=eq.'+subscribedBusinessId},async payload=>{if(cloudBusinessId!==subscribedBusinessId||payload.new?.updated_by===cloudUser?.id)return;if(cloudDirty||cloudSaving){cloudConflict=true;toast('অন্য ডিভাইসে ডেটা বদলেছে। Sync Conflict এড়াতে Cloud পেজ থেকে সর্বশেষ ডেটা Reload করুন।');return}try{await loadCloudBusinessState(true);toast('অন্য কর্মচারীর পরিবর্তন Sync হয়েছে।')}catch(e){toast('নতুন Cloud ডেটা আনা যায়নি: '+cloudFriendlyError(e))}}).subscribe(status=>{if(status==='CHANNEL_ERROR'||status==='TIMED_OUT')toast('Realtime Sync সংযোগে সমস্যা হয়েছে। পেজ Reload করে দেখুন।')})}
async function loadCloudBusinessState(replace=false){if(!sbClient||!cloudBusinessId)throw new Error('কোনো Cloud Business নির্বাচন করা হয়নি।');const {data,error}=await sbClient.from('business_state').select('data,version,updated_at,updated_by').eq('business_id',cloudBusinessId).single();if(error)throw error;if(replace){db=data.data;migratePhase2();launchEnsureData();activeBranchId=db.settings.activeBranchId||MAIN_BRANCH_ID;localPersist()}cloudVersion=Number(data.version||1);cloudLastSync=data.updated_at||null;cloudConflict=false;render();return data}
async function loadCloudMemberships(preferredId=null){if(!sbClient||!cloudUser)return;const {data,error}=await sbClient.from('business_members').select('business_id,email,role,joined_at,businesses(name)').eq('user_id',cloudUser.id).order('joined_at');if(error)throw error;cloudMemberships=(data||[]).map(x=>({id:x.business_id,role:x.role,email:x.email,name:x.businesses?.name||'ব্যবসা'}));if(!cloudMemberships.length){cloudBusiness=null;cloudBusinessId=null;cloudRole=null;stopCloudRealtime();setPage('cloud');return}const wanted=preferredId||localStorage.getItem(ACTIVE_BIZ_KEY);const member=cloudMemberships.find(x=>x.id===wanted)||cloudMemberships[0];await activateCloudBusiness(member.id)}
async function activateCloudBusiness(id){const member=cloudMemberships.find(x=>x.id===id);if(!member)throw new Error('এই ব্যবসায় আপনার Membership নেই।');cloudBusinessId=member.id;cloudBusiness={id:member.id,name:member.name};cloudRole=member.role;localStorage.setItem(ACTIVE_BIZ_KEY,id);await loadCloudBusinessState(true);subscribeCloudRealtime();setCloudNav();if(page==='cloud')render()}
async function initCloudStartup(){
 const params=new URLSearchParams(location.search),oauthReturn=params.get('cashloom_google_login')==='1';
 if(!cloudConfig?.url||!cloudConfig?.key){setCloudNav();if(oauthReturn)setPage('cloud');return}
 try{
  makeSupabaseClient(cloudConfig);
  const {data,error}=await sbClient.auth.getSession();if(error)throw error;
  if(data.session){cloudUser=data.session.user;await loadCloudMemberships();}
  if(oauthReturn)setPage('cloud');
  setCloudNav();
 }catch(e){cloudInitError=cloudFriendlyError(e);setCloudNav();if(oauthReturn)setPage('cloud');}
 finally{if(oauthReturn){const cleanUrl=new URL(location.href);cleanUrl.searchParams.delete('cashloom_google_login');history.replaceState({},'',cleanUrl.toString());}}
}
async function saveCloudConfig(form){const fd=new FormData(form),url=String(fd.get('url')||'').trim().replace(/\/$/,''),key=String(fd.get('key')||'').trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)&&!/^http:\/\/localhost(?::\d+)?$/i.test(url)){toast('Supabase Project URL সঠিক নয়।');return}if(key.length<20){toast('Publishable/Anon Key সঠিকভাবে দিন।');return}cloudConfig={url,key};localStorage.setItem(CLOUD_CFG_KEY,JSON.stringify(cloudConfig));try{makeSupabaseClient(cloudConfig);const {error}=await sbClient.auth.getSession();if(error)throw error;cloudInitError='';toast('Supabase client সংযুক্ত হয়েছে। এখন Account দিয়ে Login করুন।');render()}catch(e){cloudInitError=cloudFriendlyError(e);toast(cloudInitError);render()}}
function cashLoomSetAuthMessage(message,state='error'){const box=document.getElementById('clAuthMessage');if(!box)return;box.textContent=message||'';box.dataset.state=state;box.hidden=!message;}
async function cashLoomSubmitAuth(form){const button=form.querySelector('button[type="submit"]');try{cashLoomSetAuthMessage('');if(button)button.disabled=true;await cloudSignIn(form,cloudAuthMode);}catch(error){cashLoomSetAuthMessage(cloudFriendlyError(error),'error');}finally{if(button&&button.isConnected)button.disabled=false;}}
async function cloudSignIn(form,mode){
 const fd=new FormData(form),email=String(fd.get('email')||'').trim().toLowerCase(),password=String(fd.get('password')||'');
 if(!sbClient)throw new Error('Supabase সংযোগ প্রস্তুত হয়নি। পেজ Reload করে আবার চেষ্টা করুন।');
 if(!email||password.length<8)throw new Error('সঠিক ইমেইল ও কমপক্ষে ৮ অক্ষরের পাসওয়ার্ড দিন।');

 if(mode==='signup'){
  const {data,error}=await sbClient.auth.signUp({email,password});
  if(error)throw error;

  // Supabase may return a session when email confirmation is disabled.
  // This flow always requires the user to sign in explicitly after signup.
  if(data?.session){
   const {error:signOutError}=await sbClient.auth.signOut({scope:'local'});
   if(signOutError)throw signOutError;
   const {data:checkData,error:checkError}=await sbClient.auth.getSession();
   if(checkError)throw checkError;
   if(checkData?.session)throw new Error('Your account was created, but automatic sign-in could not be cleared. Please sign out and try again.');
  }

  try{sessionStorage.setItem('cashloom_signup_success_email',email);}catch(e){}
  cloudAuthMode='signin';
  cashLoomAuthGateRender();
  return;
 }

 const {error}=await sbClient.auth.signInWithPassword({email,password});
 if(error)throw error;
 const {data:sessionData,error:sessionError}=await sbClient.auth.getSession();
 if(sessionError)throw sessionError;
 const session=sessionData?.session;
 if(!session)throw new Error('Login session was not created. Please try again.');

 cloudUser=session.user;
 try{await loadCloudMemberships()}catch(membershipError){cloudInitError=cloudFriendlyError(membershipError);}
 setCloudNav();
 try{sessionStorage.removeItem('cashloom_signup_success_email');}catch(e){}
 if(form.closest('#cashloomAuthGate')){
  cashLoomCloseAuthGate();
  history.replaceState({},'',cashLoomBasePath());
  await setPage('dashboard');
  toast('Login সফল হয়েছে। Cash Loom-এ স্বাগতম।');
 }else if(cloudBusinessId)toast('Cloud Login সফল হয়েছে।');
 else toast('Login সফল। এখন Business তৈরি করুন বা Invitation গ্রহণ করুন।');
}

async function createCloudBusiness(form){if(!sbClient||!cloudUser)throw new Error('প্রথমে Login করুন।');const fd=new FormData(form),name=String(fd.get('name')||'').trim();if(name.length<2)throw new Error('ব্যবসার নাম লিখুন।');const initial=cleanStateCopy();initial.settings=initial.settings||{};initial.settings.businessName=name;initial.settings.owner=cloudUser.user_metadata?.full_name||cloudUser.email||'ব্যবসার মালিক';initial.version=3;const {data,error}=await sbClient.rpc('create_business',{p_name:name,p_initial_data:initial});if(error)throw error;await loadCloudMemberships(data);toast('Cloud Business তৈরি হয়েছে। বর্তমান Browser-এর Local Data import করা হয়েছে।')}
async function hashInviteToken(token){const bytes=new TextEncoder().encode(token);const digest=await crypto.subtle.digest('SHA-256',bytes);return Array.from(new Uint8Array(digest)).map(x=>x.toString(16).padStart(2,'0')).join('')}
async function createCloudInvite(form){if(!canManageCloud())throw new Error('শুধু Owner/Admin/Manager Invitation তৈরি করতে পারবেন।');const fd=new FormData(form),email=String(fd.get('email')||'').trim().toLowerCase(),role=String(fd.get('role')||'cashier');if(!/^\S+@\S+\.\S+$/.test(email))throw new Error('সঠিক ইমেইল দিন।');if(!['manager','cashier','storekeeper','accountant'].includes(role))throw new Error('Role সঠিক নয়।');const token=crypto.randomUUID().replace(/-/g,'')+crypto.randomUUID().replace(/-/g,'');const tokenHash=await hashInviteToken(token);const {error}=await sbClient.rpc('create_business_invitation',{p_business_id:cloudBusinessId,p_email:email,p_role:role,p_token_hash:tokenHash});if(error)throw error;cloudInviteLink=location.origin+location.pathname+'?invite='+token;render();toast('Invitation তৈরি হয়েছে। Link কপি করে কর্মচারীকে পাঠান।')}
async function acceptCloudInvite(form){if(!sbClient||!cloudUser)throw new Error('প্রথমে নির্দিষ্ট ইমেইল দিয়ে Account তৈরি করে Login করুন।');const fd=new FormData(form),token=String(fd.get('token')||new URLSearchParams(location.search).get('invite')||'').trim();if(token.length<20)throw new Error('Invitation Link বা Token দিন।');const tokenHash=await hashInviteToken(token);const {data,error}=await sbClient.rpc('accept_business_invitation',{p_token_hash:tokenHash});if(error)throw error;history.replaceState({},'',location.pathname);localStorage.removeItem(PENDING_INVITE_KEY);await loadCloudMemberships(data);toast('Invitation গ্রহণ হয়েছে। এখন Shared Business ব্যবহার করতে পারবেন।')}
async function cloudSignOut(){stopCloudRealtime();if(sbClient)await sbClient.auth.signOut();cloudUser=null;cloudBusiness=null;cloudBusinessId=null;cloudRole=null;cloudMemberships=[];cloudVersion=0;cloudDirty=false;setCloudNav();setPage('cloud');toast('Cloud Account থেকে Sign Out হয়েছে। Local Demo Data মুছে যায়নি।')}
async function reloadCloudNow(){if(!cloudBusinessId)return;try{await loadCloudBusinessState(true);toast('সর্বশেষ Cloud Data Reload হয়েছে।')}catch(e){toast(cloudFriendlyError(e))}}
async function cloudGoogleSignIn(){
 if(!sbClient)throw new Error('Supabase সংযোগ প্রস্তুত হয়নি। পেজ Reload করে আবার চেষ্টা করুন।');
 const returnUrl=new URL(location.href);
 const inviteToken=new URLSearchParams(location.search).get('invite')||localStorage.getItem(PENDING_INVITE_KEY)||'';
 returnUrl.search='';
 returnUrl.searchParams.set('cashloom_google_login','1');
 if(inviteToken)returnUrl.searchParams.set('invite',inviteToken);
 const {error}=await sbClient.auth.signInWithOAuth({
  provider:'google',
  options:{redirectTo:returnUrl.toString(),queryParams:{prompt:'select_account'}}
 });
 if(error)throw error;
}

function cashLoomShowAuthGate(){
 const gate=document.getElementById('cashloomAuthGate');if(!gate||cloudUser)return;
 cashLoomAuthGateRender();gate.hidden=false;gate.setAttribute('aria-hidden','false');
}
function cashLoomBasePath(){
 const path=location.pathname||'/';
 const loginMatch=path.match(/^(.*\/)login\/?$/i);
 if(loginMatch)return loginMatch[1]||'/';
 if(path.endsWith('/index.html'))return path.slice(0,-'index.html'.length);
 if(path.endsWith('/'))return path;
 const slash=path.lastIndexOf('/');return slash>=0?path.slice(0,slash+1):'/';
}
function cashLoomLoginPath(){return cashLoomBasePath()+'login/';}
function cashLoomRedirectToLogin(){
 if(location.protocol==='file:'){cashLoomShowAuthGate();return;}
 const loginPath=cashLoomLoginPath();
 const currentPath=(location.pathname||'/').replace(/\/+$/,'')||'/';
 const targetPath=loginPath.replace(/\/+$/,'')||'/';
 if(currentPath!==targetPath&&!cashLoomAuthRedirecting){
  cashLoomAuthRedirecting=true;
  location.replace(loginPath+'?next='+encodeURIComponent(location.pathname+location.search+location.hash));
 }else{
  cashLoomShowAuthGate();
 }
}
async function cashLoomRequireSession(){
 if(!sbClient)makeSupabaseClient(cloudConfig);
 const {data,error}=await sbClient.auth.getSession();
 if(error)throw error;
 const session=data?.session||null;
 if(session)cloudUser=session.user;
 else cloudUser=null;
 return session;
}
async function cashLoomGuardedNavigation(p,applyNavigation){
 const seq=++cashLoomAuthNavSequence;
 try{
  const session=await cashLoomRequireSession();
  if(seq!==cashLoomAuthNavSequence)return;
  if(!session){cashLoomShowAuthGate();cashLoomRedirectToLogin();return;}
  cashLoomAuthRedirecting=false;
  applyNavigation();
 }catch(error){
  if(seq!==cashLoomAuthNavSequence)return;
  cloudUser=null;cashLoomShowAuthGate();cashLoomRedirectToLogin();
 }

function deleteBranch(id){if(id===MAIN_BRANCH_ID){toast('প্রধান শাখা মুছে ফেলা যাবে না।');return}let used=['sales','purchases','expenses','customerPayments','supplierPayments'].some(k=>db[k].some(x=>x.branchId===id));if(used){toast('এই শাখায় লেনদেন আছে। ইতিহাস রক্ষার জন্য মুছতে পারবেন না।');return}if(!confirm('শাখাটি মুছে ফেলবেন?'))return;db.branches=db.branches.filter(b=>b.id!==id);db.products.forEach(p=>{if(p.branchStocks)delete p.branchStocks[id]});if(activeBranchId===id)switchBranch(MAIN_BRANCH_ID);else{save();render()}toast('শাখা মুছে ফেলা হয়েছে।')}
function branchesPage(){let cards=db.branches.map(b=>{let sales=inBranchFor(db.sales,b.id),purchases=inBranchFor(db.purchases,b.id),expenses=inBranchFor(db.expenses,b.id),rev=sum(sales,'total'),profit=sum(sales,'profit'),stock=db.products.reduce((a,p)=>a+Number(p.branchStocks?.[b.id]||0),0);return `<div class="branch-card ${b.id===activeBranchId?'active':''}"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h3>${esc(b.name)}</h3>${b.id===activeBranchId?'<span class="badge blue">বর্তমান</span>':'<span class="badge">শাখা</span>'}</div><p>${esc(b.code||'কোড নেই')} · ${esc(b.address||'ঠিকানা যোগ হয়নি')}<br>${esc(b.phone||'ফোন নেই')}</p><div class="branch-metrics"><div><strong>${money(rev)}</strong><small>মোট বিক্রি</small></div><div><strong>${money(profit)}</strong><small>গ্রস প্রফিট</small></div><div><strong>${stock}</strong><small>স্টক ইউনিট</small></div><div><strong>${money(sum(expenses,'amount'))}</strong><small>খরচ · ক্রয় ${money(sum(purchases,'total'))}</small></div></div><div class="actions"><button class="btn ${b.id===activeBranchId?'':'primary'} small" data-switch-branch="${b.id}" ${b.id===activeBranchId?'disabled':''}>এই শাখা চালু করুন</button>${b.id!==MAIN_BRANCH_ID?`<button class="btn danger small" data-delete-branch="${b.id}">মুছুন</button>`:''}</div></div>`}).join('');return `<div class="page-head"><div><div class="eyebrow">PHASE 2 · MULTI-BRANCH</div><h1>শাখা ব্যবস্থাপনা</h1><p>প্রতিটি শাখার বিক্রি, খরচ ও স্টক আলাদাভাবে পরিচালনা করুন।</p></div><button class="btn primary" data-action="add-branch">＋ নতুন শাখা</button></div><div class="grid stats">${stat('মোট শাখা',db.branches.length,'⌂','indigo')}${stat('মোট বিক্রি',money(sum(db.sales,'total')),'৳','mint')}${stat('মোট কর্মচারী',db.employees.filter(e=>e.isActive!==false).length,'♙','amber')}${stat('সক্রিয় শাখা',esc(activeBranch().name),'✓','rose')}</div><div class="branch-grid">${cards}</div><div class="phase-note">শাখা পরিবর্তন করলে POS ও বর্তমান স্টক ওই শাখার ডেটা দেখাবে। আগের Phase 1 ডেটা স্বয়ংক্রিয়ভাবে “প্রধান শাখা”-তে রাখা হয়েছে। এটি একই Browser-এর লোকাল ডেটা; বিভিন্ন শাখার আলাদা কম্পিউটার থেকে shared live data দেখতে Cloud Backend প্রয়োজন।</div>`}
function inBranchFor(arr,id){return (arr||[]).filter(x=>(x.branchId||MAIN_BRANCH_ID)===id)}
function analyticsDays(){let n=Number(analyticsRange)||30,now=new Date(),out=[];for(let i=n-1;i>=0;i--){let d=new Date(now);d.setDate(now.getDate()-i);let k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');out.push({key:k,label:d.toLocaleDateString(cashLoomLocale(),{day:'numeric',month:n>14?'short':undefined}),value:sum(inBranch(db.sales).filter(s=>s.date===k),'total')})}return out}
function analyticsPage(){let days=analyticsDays(),sales=inBranch(db.sales).filter(s=>{let start=new Date();start.setDate(start.getDate()-(Number(analyticsRange)||30)-1);return s.date>=dateKey(start)}),expenses=inBranch(db.expenses).filter(e=>e.date>=days[0].key),revenue=sum(sales,'total'),profit=sum(sales,'profit'),cost=sum(sales,'costTotal'),expense=sum(expenses,'amount'),max=Math.max(1,...days.map(d=>d.value));let products={};sales.forEach(s=>(s.items||[]).forEach(x=>{let k=x.id||x.name;products[k]=products[k]||{name:x.name,qty:0,revenue:0,profit:0};products[k].qty+=Number(x.qty||0);products[k].revenue+=Number(x.qty||0)*Number(x.price||0);products[k].profit+=(Number(x.price||0)-Number(x.cost||0))*Number(x.qty||0)}));let top=Object.values(products).sort((a,b)=>b.revenue-a.revenue).slice(0,6);let cats={};sales.forEach(s=>(s.items||[]).forEach(x=>{let k=x.category||db.products.find(p=>p.id===x.id)?.category||'অন্যান্য';cats[k]=(cats[k]||0)+Number(x.qty||0)*Number(x.price||0)}));let catRows=Object.entries(cats).sort((a,b)=>b[1]-a[1]);let branchRows=db.branches.map(b=>({b,rev:sum(inBranchFor(db.sales,b.id).filter(s=>s.date>=days[0].key),'total'),profit:sum(inBranchFor(db.sales,b.id).filter(s=>s.date>=days[0].key),'profit')})).sort((a,b)=>b.rev-a.rev);let cashier={};sales.forEach(s=>{if(s.employeeId){let e=db.employees.find(x=>x.id===s.employeeId);if(!e||e.isActive===false)return;let name=e.name;cashier[name]=(cashier[name]||0)+Number(s.total||0)}});let topCashiers=Object.entries(cashier).sort((a,b)=>b[1]-a[1]).slice(0,5);return `<div class="page-head"><div><div class="eyebrow">PHASE 2 · BUSINESS INTELLIGENCE</div><h1>Advanced Analytics</h1><p>${esc(activeBranch().name)} · বিক্রি, লাভ, পণ্য ও কর্মচারীর পারফরম্যান্স বিশ্লেষণ।</p></div><div class="actions"><select id="analyticsRange" class="filter-search"><option value="7" ${analyticsRange==='7'?'selected':''}>গত ৭ দিন</option><option value="30" ${analyticsRange==='30'?'selected':''}>গত ৩০ দিন</option><option value="90" ${analyticsRange==='90'?'selected':''}>গত ৯০ দিন</option></select><button class="btn" data-action="export-analytics">⇩ CSV</button></div></div><div class="kpi-grid"><div class="kpi"><span>মোট বিক্রি</span><strong>${money(revenue)}</strong><small>${sales.length}টি ইনভয়েস</small></div><div class="kpi"><span>গ্রস প্রফিট</span><strong>${money(profit)}</strong><small>মার্জিন ${revenue?(profit/revenue*100).toFixed(1):'0.0'}%</small></div><div class="kpi"><span>রেকর্ড করা খরচ</span><strong>${money(expense)}</strong><small>নির্বাচিত সময়সীমা</small></div><div class="kpi"><span>প্রাথমিক নেট ফলাফল</span><strong>${money(profit-expense)}</strong><small>গ্রস প্রফিট − খরচ</small></div></div><div class="grid dashboard-grid"><div class="panel">${panelHead('বিক্রির ট্রেন্ড',`গত ${analyticsRange} দিনের দৈনিক বিক্রি`)}<div class="analytics-bars">${days.map(d=>`<div class="analytics-bar-col"><div class="analytics-bar" style="height:${Math.max(2,d.value/max*88)}%">${d.value?`<small>${money(d.value)}</small>`:''}</div><span>${d.label}</span></div>`).join('')}</div></div><div class="panel">${panelHead('ক্যাটাগরি অনুযায়ী বিক্রি','পণ্যের ক্যাটাগরির ভিত্তিতে')}${catRows.length?catRows.slice(0,7).map(([name,val])=>`<div class="rule-row"><div class="rule-copy"><strong>${esc(name)}</strong><small>${money(val)}</small><div class="progress-line" style="margin-top:6px"><i style="width:${Math.max(2,val/Math.max(1,revenue)*100)}%"></i></div></div></div>`).join(''):empty('নির্বাচিত সময়ে বিক্রি নেই।')}</div></div><div class="grid dashboard-lower"><div class="panel">${panelHead('সেরা বিক্রি হওয়া পণ্য','আয়ের ভিত্তিতে শীর্ষ পণ্য')}${top.length?table(['পণ্য','পরিমাণ','বিক্রি','আনুমানিক লাভ'],top.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.qty}</td><td>${money(x.revenue)}</td><td>${money(x.profit)}</td></tr>`).join('')):empty()}</div><div class="panel">${panelHead('শাখার পারফরম্যান্স',`সব শাখা · ${analyticsRange} দিন`)}${table(['শাখা','বিক্রি','গ্রস প্রফিট'],branchRows.map(x=>`<tr><td>${esc(x.b.name)}</td><td>${money(x.rev)}</td><td>${money(x.profit)}</td></tr>`).join(''))}</div></div><div class="grid dashboard-lower"><div class="panel">${panelHead('কর্মচারীর বিক্রি','POS-এ বিক্রয়কারী নির্বাচন করলে হিসাব হবে')}${topCashiers.length?table(['কর্মচারী','মোট বিক্রি'],topCashiers.map(x=>`<tr><td>${esc(x[0])}</td><td>${money(x[1])}</td></tr>`).join('')):empty('POS-এ কর্মচারী নির্বাচন করে বিক্রি রেকর্ড করুন।')}</div><div class="panel">${panelHead('মার্জিন ও খরচের সারাংশ','নির্বাচিত সময়সীমা')}<div class="list"><div class="list-row"><div class="row-main"><strong>পণ্যের আনুমানিক Cost</strong></div><div class="row-value">${money(cost)}</div></div><div class="list-row"><div class="row-main"><strong>গ্রস প্রফিট মার্জিন</strong></div><div class="row-value">${revenue?(profit/revenue*100).toFixed(1):'0.0'}%</div></div><div class="list-row"><div class="row-main"><strong>প্রতি ইনভয়েসে গড় বিক্রি</strong></div><div class="row-value">${money(sales.length?revenue/sales.length:0)}</div></div></div></div></div><p class="phase-note">Analytics রিপোর্ট বর্তমান Browser-এ সংরক্ষিত রেকর্ডের ওপর নির্ভর করে। এটি পূর্ণাঙ্গ audited financial statement নয়; রিটার্ন, VAT, দায়-দেনা ও accrual accounting এতে সম্পূর্ণ অন্তর্ভুক্ত নয়।</p>`}
function runAutomationRules(force=false){let added=0,now=Date.now(),day=today();const add=(ruleKey,title,description,icon='⚠')=>{let exists=db.notifications.some(n=>n.ruleKey===ruleKey&&n.date===day&&n.branchId===activeBranchId);if(!exists){db.notifications.unshift({id:uid(),ruleKey,title,description,icon,date:day,createdAt:now,branchId:activeBranchId,read:false});added++}};if(db.automation.lowStockEnabled){db.products.filter(p=>p.isActive!==false&&Number(p.stock)<=Number(p.lowStock??db.settings.lowStock)).forEach(p=>add('stock-'+p.id,'স্টক কমে এসেছে',`${p.name}: বর্তমান স্টক ${p.stock} ${p.unit||'ইউনিট'}। পুনরায় অর্ডার বিবেচনা করুন।`))}if(db.automation.dueEnabled){db.customers.filter(c=>c.isActive!==false&&customerDue(c.id)>=Number(db.automation.dueThreshold||10000)&&customerDue(c.id)>0).forEach(c=>add('due-'+c.id,'কাস্টমারের বকেয়া বেশি',`${c.name}-এর কাছে ${money(customerDue(c.id))} বকেয়া রয়েছে।`,'৳'))}if(force&&added===0)toast('নতুন কোনো সতর্কতা পাওয়া যায়নি।');if(added)save();return added}
function automationPage(){runAutomationRules();let notices=db.notifications.filter(n=>n.branchId===activeBranchId).sort((a,b)=>b.createdAt-a.createdAt),unread=notices.filter(n=>!n.read).length,todaySales=sum(inBranch(db.sales).filter(s=>s.date===today()),'total'),target=Number(db.automation.dailyTarget||0),progress=target?Math.min(100,todaySales/target*100):0;return `<div class="page-head"><div><div class="eyebrow">PHASE 2 · SMART OPERATIONS</div><h1>Automation Center</h1><p>স্টক, কাস্টমার বাকি ও দৈনিক ব্যবসার লক্ষ্য পর্যবেক্ষণ করুন।</p></div><div class="actions"><button class="btn" data-action="mark-notifications">সব Read</button><button class="btn primary" data-action="run-automation">↻ এখন পরীক্ষা করুন</button></div></div><div class="grid stats">${stat('নতুন সতর্কতা',unread,'◉','rose')}${stat('মোট সতর্কতা',notices.length,'✧','indigo')}${stat('আজকের বিক্রি',money(todaySales),'৳','mint')}${stat('দৈনিক লক্ষ্য',target?money(target):'সেট করা নেই','◎','amber')}</div><div class="grid dashboard-grid"><div class="panel">${panelHead('Automation Rules','যে নিয়ম চালু থাকবে, অ্যাপ খুললে তা পরীক্ষা হবে')}<form id="automationForm"><div class="rule-row"><div class="rule-copy"><strong>Low Stock Alert</strong><small>পণ্যের স্টক নির্ধারিত সীমার নিচে বা সমান হলে সতর্কতা। প্রতি পণ্যের Low Stock সেটিংস ব্যবহৃত হয়।</small></div><label class="switch"><input type="checkbox" data-automation="lowStockEnabled" ${db.automation.lowStockEnabled?'checked':''}><span></span></label></div><div class="rule-row"><div class="rule-copy"><strong>High Customer Due Alert</strong><small>কাস্টমারের বকেয়া নির্ধারিত অঙ্কে পৌঁছালে সতর্কতা।</small></div><label class="switch"><input type="checkbox" data-automation="dueEnabled" ${db.automation.dueEnabled?'checked':''}><span></span></label></div><div class="field" style="margin:9px 0 15px"><label>বকেয়ার সতর্কতা সীমা (৳)</label><input id="dueThreshold" type="number" min="1" value="${Number(db.automation.dueThreshold||10000)}"></div><div class="rule-row"><div class="rule-copy"><strong>Daily Sales Target Tracker</strong><small>আজকের বিক্রি ও নির্ধারিত বিক্রির লক্ষ্য দেখাবে।</small></div><label class="switch"><input type="checkbox" data-automation="dailyTargetEnabled" ${db.automation.dailyTargetEnabled?'checked':''}><span></span></label></div><div class="field" style="margin:9px 0 15px"><label>দৈনিক বিক্রির লক্ষ্য (৳)</label><input id="dailyTarget" type="number" min="0" value="${target}"></div><div class="form-actions"><button class="btn primary" type="submit">নিয়ম সংরক্ষণ</button></div></form></div><div class="panel">${panelHead('আজকের লক্ষ্য','বর্তমান শাখা · দৈনিক অগ্রগতি')}<div style="font-size:23px;font-weight:850;color:#2c3d55;margin:13px 0 5px">${money(todaySales)}</div><div class="progress-line"><i style="width:${progress}%"></i></div><p class="muted" style="font-size:9px;margin:8px 0 0">${target?progress.toFixed(1)+'% সম্পন্ন · বাকি '+money(Math.max(0,target-todaySales)):'দৈনিক লক্ষ্য নির্ধারণ করুন।'}</p><div class="phase-note">এটি In-app automation। Browser বন্ধ থাকলে এটি background-এ চলবে না এবং SMS/WhatsApp পাঠায় না।</div></div></div><div class="panel" style="margin-top:13px">${panelHead('সতর্কতা ও নোটিফিকেশন',`${notices.length}টি নোটিফিকেশন · ${unread}টি Unread`)}${notices.length?notices.slice(0,40).map(n=>`<div class="notice-item ${n.read?'':'unread'}"><div class="notice-icon">${esc(n.icon||'⚠')}</div><div><strong>${esc(n.title)}</strong><p>${esc(n.description)}</p><small>${fmtDateTime(n.date,n.transactionAt||n.createdAt)} · ${esc(branchName(n.branchId))}</small></div></div>`).join(''):empty('এখনো কোনো সতর্কতা নেই।')}</div>`}

function pharmacyIndustry(lots){let active=lots.filter(x=>x.kind==='pharmacy'),exp=active.filter(x=>x.qtyRemaining>0&&x.expiry&&x.expiry<today()),soon=active.filter(x=>x.qtyRemaining>0&&x.expiry&&x.expiry>=today()&&x.expiry<=dateOffset(90));return `<div class="grid stats">${stat('Medicine Batch',active.length,'▤','indigo')}${stat('মেয়াদোত্তীর্ণ',exp.length,'⚠','rose')}${stat('৯০ দিনের মধ্যে Expiry',soon.length,'◷','amber')}${stat('Batch-এ অবশিষ্ট ইউনিট',active.reduce((a,x)=>a+Number(x.qtyRemaining||0),0),'💊','mint')}</div><div class="industry-grid"><div class="panel">${panelHead('Medicine Batch Register','Batch number, manufacturer, expiry ও MRP','<button class="btn primary small" data-industry-action="add-pharmacy-batch">＋ Medicine Batch</button>')}${active.length?table(['Batch / Medicine','Manufacturer','অবশিষ্ট','Expiry / Status','MRP','Action'],active.slice().sort((a,b)=>String(a.expiry).localeCompare(String(b.expiry))).map(x=>`<tr><td><b>${esc(x.batchNo)}</b><div class="table-sub">${esc(x.productName||industryProductName(x.productId))} · ${esc(x.strength||'')}</div></td><td>${esc(x.manufacturer||'—')}</td><td>${x.qtyRemaining} / ${x.qty}</td><td>${fmtDate(x.expiry)}<div style="margin-top:4px">${lotExpiryLabel(x.expiry)}</div></td><td>${money(x.mrp||x.cost||0)}</td><td><button class="btn small danger" data-industry-action="lot-writeoff" data-id="${x.id}" ${Number(x.qtyRemaining||0)<=0?'disabled':''}>Write-off</button></td></tr>`).join('')):empty('এখনো কোনো Medicine Batch যোগ করা হয়নি۔')}</div><div class="panel">${panelHead('Pharmacy Safety Checklist','Batch ও মেয়াদ সংক্রান্ত সতর্কতা')}${exp.length?`<div class="industry-alert">${exp.length}টি মেয়াদোত্তীর্ণ Batch রয়েছে। এগুলো বিক্রয়যোগ্য স্টক হিসেবে ব্যবহার করবেন না।</div>`:empty('রেকর্ড করা Batch-এ মেয়াদোত্তীর্ণ স্টক পাওয়া যায়নি।')}${soon.length?`<div class="industry-alert">${soon.length}টি Batch আগামী ৯০ দিনের মধ্যে মেয়াদ শেষ হবে।</div>`:''}<div class="industry-alert success">Pharmacy POS-এ Batch নিবন্ধিত থাকলে বিক্রি মেয়াদযুক্ত Batch-এর উপলভ্য পরিমাণ অনুযায়ী যাচাই করা হবে এবং আগে মেয়াদ শেষ হওয়া Batch থেকে কমবে।</div><p class="recipe-note">এই মডিউল inventory operation-এর জন্য; ওষুধ নির্বাচন, prescription validation বা clinical advice দেয় না।</p></div></div>`}
function fashionIndustry(variants){let total=variants.reduce((a,x)=>a+Number(x.qty||0),0),low=variants.filter(x=>x.qty<=x.lowStock);return `<div class="grid stats">${stat('Variant SKU',variants.length,'👕','indigo')}${stat('Variant Stock',total,'▦','mint')}${stat('Low Variant',low.length,'⚠','amber')}${stat('Unique Styles',new Set(variants.map(x=>x.productId)).size,'◇','rose')}</div><div class="industry-grid"><div class="panel">${panelHead('Size & Colour Matrix','একই পণ্যের size ও colour অনুযায়ী স্টক','<button class="btn primary small" data-industry-action="add-variant">＋ Variant যোগ</button>')}${variants.length?table(['পণ্য','Size','Colour','Variant SKU','Qty','স্টক অবস্থা','Action'],variants.map(v=>`<tr><td>${esc(industryProductName(v.productId))}</td><td><b>${esc(v.size)}</b></td><td>${esc(v.color)}</td><td>${esc(v.sku||'—')}</td><td>${v.qty}</td><td>${v.qty<=v.lowStock?'<span class="industry-pill soon">Low</span>':'<span class="industry-pill">OK</span>'}</td><td><button class="btn small" data-industry-action="variant-adjust" data-id="${v.id}">Adjust</button></td></tr>`).join('')):empty('এখনো কোনো Variant তৈরি হয়নি।')}</div><div class="panel">${panelHead('Variant Sale','Size / colour নির্বাচন করে বিক্রি রেকর্ড করুন','<button class="btn primary small" data-industry-action="variant-sale">Variant বিক্রি</button>')}<p class="muted" style="font-size:10px;line-height:1.7">Variant বিক্রি সাধারণ Sales Ledger-এ Invoice হিসেবে যোগ হবে, Variant Qty ও মূল পণ্যের branch stock কমবে এবং Customer Due হিসাবেও যুক্ত হবে।</p><div class="industry-alert">Variant Qty-কে মূল পণ্যের বর্তমান stock-এর একটি allocation হিসেবে ধরা হয়। Variant যোগের সময় allocated quantity যেন মোট stock ছাড়িয়ে না যায়।</div>${low.length?`<div class="industry-alert">${low.length}টি Variant-এর স্টক কম।</div>`:empty('Variant stock স্বাভাবিক আছে।')}</div></div>`}
function electronicsIndustry(warranties,tickets){let active=warranties.filter(w=>w.status==='Active'&&w.warrantyEnd>=today()),expired=warranties.filter(w=>w.warrantyEnd<today());return `<div class="grid stats">${stat('Warranty Record',warranties.length,'▣','indigo')}${stat('সক্রিয় Warranty',active.length,'✓','mint')}${stat('মেয়াদ শেষ',expired.length,'◷','amber')}${stat('Repair Ticket',tickets.length,'⚒','rose')}</div><div class="industry-grid"><div class="panel">${panelHead('Serial / IMEI Warranty Register','বিক্রিত পণ্যের serial number ও warranty end date','<button class="btn primary small" data-industry-action="add-warranty">＋ Warranty যোগ</button>')}${warranties.length?table(['Serial / IMEI','পণ্য','কাস্টমার','Warranty End','অবস্থা'],warranties.map(w=>`<tr><td><b>${esc(w.serial)}</b></td><td>${esc(industryProductName(w.productId))}</td><td>${esc(w.customerName||'—')}</td><td>${fmtDate(w.warrantyEnd)}</td><td>${w.warrantyEnd<today()?'<span class="industry-pill expired">Expired</span>':`<span class="industry-pill">${esc(w.status)}</span>`}</td></tr>`).join('')):empty('এখনো কোনো Warranty Record নেই।')}</div><div class="panel">${panelHead('Repair / Service Desk','Customer complaint ও repair ticket ট্র্যাক করুন','<button class="btn primary small" data-industry-action="add-repair">＋ Repair Ticket</button>')}${tickets.length?table(['Ticket','Serial','সমস্যা','Status','পরবর্তী ধাপ'],tickets.map(t=>`<tr><td><b>${esc(t.ticketNo)}</b></td><td>${esc(warranties.find(w=>w.id===t.warrantyId)?.serial||'—')}</td><td>${esc(t.issue)}</td><td><span class="industry-pill">${esc(t.status)}</span></td><td><button class="btn small" data-industry-action="repair-next" data-id="${t.id}">Update</button></td></tr>`).join('')):empty('এখনো কোনো Repair Ticket নেই।')}</div></div>`}
function restaurantIndustry(menus,kots){let open=kots.filter(k=>!['Served','Cancelled'].includes(k.status));return `<div class="grid stats">${stat('Menu Items',menus.length,'🍽️','indigo')}${stat('Open Kitchen Tickets',open.length,'▤','amber')}${stat('Ready to Serve',kots.filter(k=>k.status==='Ready').length,'✓','mint')}${stat('আজকের Ticket',kots.filter(k=>k.date===today()).length,'◷','rose')}</div><div class="grid dashboard-lower"><div class="panel">${panelHead('Restaurant Menu','Menu item, price ও একটি inventory ingredient link','<button class="btn primary small" data-industry-action="add-menu">＋ Menu Item</button>')}${menus.length?table(['Menu Item','Price','Ingredient','Qty / Serving'],menus.map(m=>`<tr><td><b>${esc(m.name)}</b><div class="table-sub">${esc(m.category||'Menu')}</div></td><td>${money(m.price)}</td><td>${esc(industryProductName(m.ingredientProductId))}</td><td>${Number(m.ingredientQty||0)}</td></tr>`).join('')):empty('প্রথমে Menu Item তৈরি করুন।')}</div><div class="panel">${panelHead('Kitchen Order Ticket (KOT)','নতুন table / takeaway order','<button class="btn primary small" data-industry-action="add-kot">＋ New KOT</button>')}${open.length?`<div class="list">${open.map(k=>{let m=menus.find(x=>x.id===k.menuItemId);return `<div class="list-row"><div class="row-main"><strong>${esc(k.orderNo)} · ${esc(m?.name||'Menu removed')}</strong><small>Table ${esc(k.tableNo||'Takeaway')} · Qty ${k.qty} · ${fmtDateTime(k.date,k.transactionAt||k.createdAt)}</small></div><span class="industry-pill">${esc(k.status)}</span><div class="industry-actions">${k.status==='Ready'?`<button class="btn small primary" data-industry-action="kot-serve" data-id="${k.id}">Serve & Post Sale</button>`:`<button class="btn small" data-industry-action="kot-next" data-id="${k.id}">Next</button>`}<button class="btn small danger" data-industry-action="kot-cancel" data-id="${k.id}">Cancel</button></div></div>`}).join('')}</div>`:empty('কোনো Open KOT নেই।')}</div></div><div class="panel" style="margin-top:13px">${panelHead('Recent Kitchen Tickets','Served ও cancelled order history')}${kots.length?table(['Order','Menu','Table','Qty','Status','Invoice'],kots.slice().sort((a,b)=>b.createdAt-a.createdAt).slice(0,15).map(k=>`<tr><td>${esc(k.orderNo)}</td><td>${esc(menus.find(x=>x.id===k.menuItemId)?.name||'—')}</td><td>${esc(k.tableNo||'Takeaway')}</td><td>${k.qty}</td><td>${esc(k.status)}</td><td>${esc(k.saleInvoice||'—')}</td></tr>`).join('')):empty()}</div><p class="recipe-note">Restaurant Recipe link-এ MVP পর্যায়ে প্রতিটি Menu Item-এর জন্য একটি inventory ingredient ও per-serving quantity সমর্থিত। Multi-ingredient recipe / modifier পরবর্তী উন্নয়ন।</p>`}
function industrySelectProducts(selected=''){return industryProducts().map(p=>`<option value="${p.id}" ${selected===p.id?'selected':''}>${esc(p.name)} · Stock ${p.stock}</option>`).join('')}

function orderStockCheck(order){const totals=new Map();for(const line of order.items){const id=line.productId;totals.set(id,(totals.get(id)||0)+Number(line.qty||0))}for(const [productId,qty] of totals){const p=db.products.find(x=>x.id===productId);if(!p||Number(p.stock||0)<qty)throw new Error((p?.name||'পণ্য')+'-এর পর্যাপ্ত stock নেই।');const kind=['grocery','pharmacy'].includes(db.settings.industryType)?db.settings.industryType:null;if(kind){const lots=(db.industryRecords?.stockLots||[]).filter(l=>l.kind===kind&&l.branchId===order.branchId&&l.productId===productId);if(lots.length){const eligible=lots.filter(l=>l.expiry>=today()).reduce((a,l)=>a+Number(l.qtyRemaining||0),0);if(eligible<qty)throw new Error(p.name+'-এর মেয়াদ-উপযোগী Batch stock অপর্যাপ্ত।')}}}}
function reserveOnlineOrderStock(order){if(order.stockReserved)return;orderStockCheck(order);const reserved=[];for(const line of order.items){const p=db.products.find(x=>x.id===line.productId);p.stock-=Number(line.qty);const kind=['grocery','pharmacy'].includes(db.settings.industryType)?db.settings.industryType:null;if(kind){const lots=(db.industryRecords?.stockLots||[]).filter(l=>l.kind===kind&&l.branchId===order.branchId&&l.productId===line.productId&&Number(l.qtyRemaining)>0&&l.expiry>=today()).sort((a,b)=>String(a.expiry).localeCompare(String(b.expiry)));if(lots.length){let left=Number(line.qty),takes=[];for(const lot of lots){if(left<=0)break;const take=Math.min(left,Number(lot.qtyRemaining));lot.qtyRemaining-=take;left-=take;takes.push({lotId:lot.id,qty:take})}if(left>0)throw new Error('Batch allocation mismatch হয়েছে। Backup ও stock যাচাই করুন।');reserved.push({productId:line.productId,takes})}}}order.reservedLots=reserved;order.stockReserved=true;order.reservedAt=Date.now()}
function releaseOnlineOrderStock(order){if(!order.stockReserved||order.saleId)return;for(const line of order.items){const p=db.products.find(x=>x.id===line.productId);if(p)p.stock=Number(p.stock||0)+Number(line.qty||0)}for(const group of (order.reservedLots||[])){for(const take of group.takes||[]){const lot=(db.industryRecords?.stockLots||[]).find(x=>x.id===take.lotId);if(lot)lot.qtyRemaining=Number(lot.qtyRemaining||0)+Number(take.qty||0)}}order.stockReserved=false;order.releasedAt=Date.now()}
function convertOnlineOrderToSale(order){if(order.saleId){toast('এই অর্ডারের Invoice আগেই তৈরি হয়েছে।');return}if(order.status!=='delivered')throw new Error('Invoice তৈরির আগে order status Delivered করুন।');if(!order.stockReserved)throw new Error('অর্ডারের stock reserve হয়নি। আগে Confirm Order করুন।');if(!order.customerId)throw new Error('Invoice তৈরির জন্য customer profile প্রয়োজন।');const items=order.items.map(x=>({id:x.productId,name:x.name,category:x.category||'',price:Number(x.price),cost:Number(x.cost||0),qty:Number(x.qty),lineTotal:Number(x.price)*Number(x.qty)}));if(Number(order.shippingFee)>0)items.push({id:'delivery-fee',name:'ডেলিভারি চার্জ',category:'Service',price:Number(order.shippingFee),cost:0,qty:1,lineTotal:Number(order.shippingFee)});const subtotal=items.reduce((a,x)=>a+Number(x.lineTotal||0),0),costTotal=items.reduce((a,x)=>a+Number(x.cost||0)*Number(x.qty||0),0),total=Math.max(0,subtotal-Number(order.discount||0));if(Number(order.paid)>total)throw new Error('অর্ডারের paid amount total ছাড়িয়েছে।');const sale={id:uid(),invoice:'WEB-'+Date.now().toString().slice(-8),date:today(),createdAt:Date.now(),branchId:order.branchId,employeeId:'',customerId:order.customerId,items,subtotal,discount:Number(order.discount||0),total,paid:Number(order.paid||0),profit:Math.max(0,total-costTotal),costTotal,note:'Online order '+order.orderNo+' · '+(order.channel||'Online')};db.sales.push(sale);order.saleId=sale.id;order.invoice=sale.invoice;order.invoicedAt=Date.now();logOrderActivity(order,'Sales invoice তৈরি: '+sale.invoice);return sale}
function onlineOrdersPage(){const orders=inBranch(db.onlineOrders).slice().sort((a,b)=>b.createdAt-a.createdAt),newCount=orders.filter(x=>x.status==='new').length,shipping=orders.filter(x=>['confirmed','packed','shipped'].includes(x.status)).length,delivered=orders.filter(x=>x.status==='delivered').length,unbilled=orders.filter(x=>!x.saleId&&x.status==='delivered').length,pendingDue=orders.filter(x=>!x.saleId&&x.status!=='cancelled').reduce((a,x)=>a+Math.max(0,Number(x.total||0)-Number(x.paid||0)),0);const filter=window.__orderFilter||'all';const visible=filter==='all'?orders:orders.filter(x=>x.status===filter);const rows=visible.map(o=>{const action=[];if(o.status==='new')action.push(`<button class="btn small primary" data-order-action="confirm" data-id="${o.id}">Confirm & Reserve</button>`);if(o.status==='confirmed')action.push(`<button class="btn small" data-order-action="pack" data-id="${o.id}">Packed</button>`);if(o.status==='packed')action.push(`<button class="btn small primary" data-order-action="ship" data-id="${o.id}">Dispatch</button>`);if(o.status==='shipped')action.push(`<button class="btn small" data-order-action="deliver" data-id="${o.id}">Delivered</button>`);if(o.status==='delivered'&&!o.saleId)action.push(`<button class="btn small primary" data-order-action="invoice" data-id="${o.id}">Create Invoice</button>`);if(!o.saleId&&!['cancelled'].includes(o.status)&&Number(o.total)>Number(o.paid))action.push(`<button class="btn small" data-order-action="payment" data-id="${o.id}">Payment</button>`);if(!o.saleId&&!['cancelled'].includes(o.status))action.push(`<button class="btn small danger" data-order-action="cancel" data-id="${o.id}">Cancel</button>`);if(o.saleId)action.push(`<button class="btn small" data-action="print-sale" data-id="${o.saleId}">Invoice</button>`);return `<tr><td><b>${esc(o.orderNo)}</b><div class="table-sub">${fmtDateTime(o.date,o.transactionAt||o.createdAt)} · ${esc(o.channel||'Online')}</div></td><td><div class="table-title">${esc(o.customerName)}</div><div class="table-sub">${esc(o.customerPhone)}</div></td><td class="order-item-summary">${o.items.map(x=>`${esc(x.name)} × ${x.qty}`).join('<br>')}<div class="table-sub">${esc(o.deliveryAddress||'')}</div></td><td><b>${money(o.total)}</b><div class="table-sub">Paid ${money(o.paid)} · Due ${money(Math.max(0,o.total-o.paid))}</div></td><td><span class="order-status ${orderStatusClass(o.status)}">${orderStatusLabel(o.status)}</span><div class="table-sub">${esc(o.courier||'Courier pending')}${o.tracking?' · '+esc(o.tracking):''}</div></td><td><div class="order-actions">${action.join('')||'<span class="muted">—</span>'}</div></td></tr>`}).join('');const logs=(db.activityLogs||[]).filter(x=>x.branchId===activeBranchId&&x.entity==='order').slice(0,12);return `<div class="order-hero"><div><div class="eyebrow">PHASE 5 · BUSINESS ECOSYSTEM</div><h1>Online Orders & Delivery</h1><p>Facebook, WhatsApp, Website ও ফোনের অর্ডার এক জায়গায় পরিচালনা করুন। Stock confirm, courier dispatch, delivery status, advance payment ও invoice tracking একই workflow-এ থাকবে।</p></div><button class="btn primary" data-order-action="new">＋ নতুন অর্ডার</button></div><div class="order-kpis"><div class="order-kpi"><strong>${newCount}</strong><small>নতুন অর্ডার</small></div><div class="order-kpi"><strong>${shipping}</strong><small>প্রসেসিং / পথে</small></div><div class="order-kpi"><strong>${delivered}</strong><small>ডেলিভারি সম্পন্ন</small></div><div class="order-kpi"><strong>${money(pendingDue)}</strong><small>অসম্পন্ন অর্ডারের বাকি</small></div></div><div class="panel"><div class="toolbar"><div><b style="font-size:12px;color:#34465f">অর্ডার তালিকা</b><div class="table-sub">${orders.length}টি অর্ডার · ${unbilled}টি delivered কিন্তু invoice হয়নি</div></div><div class="order-filter"><select id="orderFilter"><option value="all" ${filter==='all'?'selected':''}>সব অর্ডার</option>${[['new','নতুন'],['confirmed','নিশ্চিত'],['packed','প্যাক করা'],['shipped','পাঠানো'],['delivered','ডেলিভারি সম্পন function exportProductsCsv(){const rows=[['name','sku','category','cost','price','stock','unit','lowStock'],...db.products.map(p=>[p.name,p.sku,p.category,p.cost,p.price,p.stock,p.unit,p.lowStock])];const csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='byabshaos-products-'+today()+'.csv';a.click();URL.revokeObjectURL(a.href);toast('Product CSV Export হয়েছে।')}
function parseCsv(text){const rows=[];let row=[],field='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(quoted){if(c==='"'&&n==='"'){field+='"';i++}else if(c==='"')quoted=false;else field+=c}else if(c==='"')quoted=true;else if(c===','){row.push(field);field=''}else if(c==='\n'){row.push(field);rows.push(row);row=[];field=''}else if(c!=='\r')field+=c}if(field.length||row.length){row.push(field);rows.push(row)}return rows.filter(r=>r.some(v=>String(v).trim()!==''))}
async function importProductsCsv(file){const txt=(await file.text()).replace(/^\uFEFF/,'');const rows=parseCsv(txt);if(rows.length<2)throw new Error('CSV-তে Header ও অন্তত একটি Product Row প্রয়োজন।');const headers=rows[0].map(x=>String(x).trim().toLowerCase());const idx=(...names)=>headers.findIndex(h=>names.includes(h));const nameI=idx('name','product','product name','পণ্যের নাম');if(nameI<0)throw new Error('CSV header-এ name কলাম পাওয়া যায়নি।');let added=0,updated=0,skipped=0;for(const r of rows.slice(1)){const name=String(r[nameI]||'').trim();if(!name){skipped++;continue}const val=(names,def='')=>{const i=idx(...names);return i<0?def:String(r[i]??def).trim()};const sku=val(['sku','barcode']);const num=(names,def=0)=>{const raw=val(names,String(def));const x=Number(raw);return Number.isFinite(x)?x:def};const cost=num(['cost','purchase price','ক্রয়মূল্য']),price=num(['price','sale price','selling price','বিক্রয়মূল্য']),stock=num(['stock','qty','quantity','স্টক']),lowStock=num(['lowstock','low stock','reorder level'],db.settings.lowStock||5);if(cost<0||price<0||stock<0||lowStock<0){skipped++;continue}let p=sku?db.products.find(x=>String(x.sku||'').toLowerCase()===sku.toLowerCase()):null;if(p){p.name=name;p.category=val(['category','ক্যাটাগরি'],p.category||'');p.cost=cost;p.price=price;p.unit=val(['unit','একক'],p.unit||'পিস');p.lowStock=lowStock;p.stock=stock;p.branchStocks=p.branchStocks||{};p.branchStocks[activeBranchId]=stock;updated++}else{const obj={id:uid(),name,sku,category:val(['category','ক্যাটাগরি']),cost,price,stock,unit:val(['unit','একক'],'পিস'),lowStock,branchStocks:{[activeBranchId]:stock}};db.products.push(obj);added++}}save();render();toast(`CSV Import সম্পন্ন · নতুন ${added}, আপডেট ${updated}, বাদ ${skipped}`)}
function orderAction(action,id){const order=inBranch(db.onlineOrders).find(x=>x.id===id);try{if(action==='new'){onlineOrderForm();return}if(action==='export'){exportOrdersCsv();return}if(action==='add-line'){const box=document.getElementById('orderLines');if(!box)return;if(box.children.length>=8){toast('এক অর্ডারে সর্বোচ্চ ৮টি পণ্য লাইন দেওয়া যাবে।');return}box.insertAdjacentHTML('beforeend',orderLineMarkup());return}if(!order)return;if(action==='confirm'){if(order.status!=='new')return;reserveOnlineOrderStock(order);order.status='confirmed';order.confirmedAt=Date.now();logOrderActivity(order,'Order confirmed · stock reserved');save();render();toast('অর্ডার নিশ্চিত ও stock reserve হয়েছে।')}else if(action==='pack'){if(order.status!=='confirmed')return;order.status='packed';order.packedAt=Date.now();logOrderActivity(order,'Order packed');save();render();toast('অর্ডার Packed হয়েছে।')}else if(action==='ship'){if(order.status!=='packed')return;orderShipForm(id)}else if(action==='deliver'){if(order.status!=='shipped')return;order.status='delivered';order.deliveredAt=Date.now();logOrderActivity(order,'Order delivered');save();render();toast('Delivery সম্পন্ন হয়েছে। এখন invoice তৈরি করতে পারবেন।')}else if(action==='invoice'){const sale=convertOnlineOrderToSale(order);save();render();toast('Sales invoice তৈরি হয়েছে: '+sale.invoice)}else if(action==='payment'){orderPaymentForm(id)}else if(action==='cancel'){if(!confirm('অর্ডারটি বাতিল করবেন? Reserved stock থাকলে তা ফেরত যাবে।'))return;releaseOnlineOrderStock(order);order.status='cancelled';order.cancelledAt=Date.now();logOrderActivity(order,'Order cancelled · reserved stock released if any');save();render();toast('অর্ডার বাতিল হয়েছে।')}}catch(e){toast(e.message||'Order action সম্পন্ন হয়নি।')}}
function exportOrdersCsv(){const rows=[['Order','Date','Channel','Customer','Phone','Address','Items','Subtotal','Shipping','Discount','Total','Paid','Due','Status','Courier','Tracking','Invoice'],...inBranch(db.onlineOrders).map(o=>[o.orderNo,o.date,o.channel,o.customerName,o.customerPhone,o.deliveryAddress,o.items.map(x=>`${x.name} x ${x.qty}`).join('; '),o.subtotal,o.shippingFee,o.discount,o.total,o.paid,Math.max(0,o.total-o.paid),orderStatusLabel(o.status),o.courier,o.tracking,o.invoice||''])];const csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='byabshaos-online-orders-'+today()+'.csv';a.click();URL.revokeObjectURL(a.href);toast('Online Orders CSV Export হয়েছে।')}

function addCart(id){let p=db.products.find(x=>x.id===id);if(!p||p.stock<=0){toast('এই পণ্যের স্টক নেই।');return}let x=cart.find(x=>x.id===id);if(x){if(x.qty>=p.stock){toast('স্টকের চেয়ে বেশি বিক্রি করা যাবে না।');return}x.qty++}else cart.push({id:p.id,name:p.name,category:p.category||'অন্যান্য',price:Number(p.price),cost:Number(p.cost),qty:1});render();}
function recalcPos(){let sub=cart.reduce((a,x)=>a+x.qty*x.price,0),discount=Math.max(0,Number(document.getElementById('posDiscount')?.value||0)),total=Math.max(0,sub-discount),paidInput=document.getElementById('posPaid'),paid=Math.max(0,Number(paidInput?.value||0));if(paidInput&&paid>total){paid=total;paidInput.value=String(total)}let set=(id,val)=>{let e=document.getElementById(id);if(e)e.textContent=val};set('posSubtotal',money(sub));set('posDiscountShow',money(discount));set('posTotal',money(total));set('posDue',money(Math.max(0,total-paid)));let btn=document.getElementById('completeSale');if(btn)btn.disabled=!cart.length||paid>total;}
function consumeIndustryLots(productId,qty){let records=db.industryRecords?.stockLots||[],kind=db.settings.industryType==='pharmacy'?'pharmacy':db.settings.industryType==='grocery'?'grocery':null;if(!kind)return;let lots=records.filter(l=>l.kind===kind&&l.branchId===activeBranchId&&l.productId===productId&&Number(l.qtyRemaining)>0&&l.expiry>=today()).sort((a,b)=>String(a.expiry||'9999').localeCompare(String(b.expiry||'9999')));let left=qty;for(const lot of lots){if(left<=0)break;let take=Math.min(left,Number(lot.qtyRemaining));lot.qtyRemaining-=take;left-=take}}
function finishSale(){if(!cart.length)return;let sub=cart.reduce((a,x)=>a+x.qty*x.price,0),discount=Math.max(0,Number(document.getElementById('posDiscount').value||0)),total=Math.max(0,sub-discount),paid=Math.max(0,Number(document.getElementById('posPaid').value||0));if(discount>sub){toast('ছাড় সাবটোটালের বেশি হতে পারে না।');return}if(paid>total){toast('প্রাপ্ত টাকা মোট বিলের বেশি হতে পারে না।');return}if(paid<total&&!document.getElementById('posCustomer').value){toast('বাকি বিক্রির জন্য আগে একজন কাস্টমার নির্বাচন করুন।');return}for(let x of cart){let p=db.products.find(p=>p.id===x.id);if(!p||p.stock<x.qty){toast('স্টক পরিবর্তিত হয়েছে। কার্ট আবার যাচাই করুন।');return}if(['pharmacy','grocery'].includes(db.settings.industryType)){let kind=db.settings.industryType,batches=(db.industryRecords.stockLots||[]).filter(l=>l.kind===kind&&l.branchId===activeBranchId&&l.productId===p.id);if(batches.length){let eligible=batches.filter(l=>l.expiry>=today()).reduce((a,l)=>a+Number(l.qtyRemaining||0),0);if(eligible<x.qty){toast('মেয়াদোত্তীর্ণ বা অপর্যাপ্ত Batch Stock। Batch Register যাচাই করুন।');return}}}}let lines=cart.map(x=>({...x,lineTotal:x.qty*x.price}));lines.forEach(x=>{let p=db.products.find(p=>p.id===x.id);p.stock-=x.qty;consumeIndustryLots(x.id,x.qty)});let sale={id:uid(),invoice:'INV-'+Date.now().toString().slice(-8),date:today(),createdAt:Date.now(),branchId:activeBranchId,employeeId:document.getElementById('posEmployee')?.value||'',customerId:document.getElementById('posCustomer').value||'',items:lines,subtotal:sub,discount,total,paid,profit:Math.max(0,lines.reduce((a,x)=>a+(x.price-x.cost)*x.qty,0)-discount),costTotal:lines.reduce((a,x)=>a+x.cost*x.qty,0)};db.sales.push(sale);save();cart=[];render();toast('বিক্রি সফলভাবে সংরক্ষণ হয়েছে।');askReceipt(sale.id)}

function printSale(id){let s=db.sales.find(x=>x.id===id);if(!s)return;let w=window.open('','_blank','width=420,height=650');if(!w){toast('Popup Block হয়েছে। Print করার জন্য popup অনুমতি দিন।');return}w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${s.invoice}</title><style>body{font:13px Arial,sans-serif;padding:22px;color:#222}h2,p{text-align:center;margin:4px}small{color:#555}.line{border-top:1px dashed #999;margin:12px 0}table{width:100%;border-collapse:collapse}td{padding:7px 0;font-size:12px}.r{text-align:right}.total{font-weight:bold;font-size:15px}</style></head><body><h2>${esc(db.settings.businessName)}</h2><p>${esc(db.settings.address||'')}</p><p>${esc(db.settings.phone||'')}</p><div class="line"></div><p>Invoice: ${esc(s.invoice)}</p><p>Date: ${fmtDateTime(s.date,s.transactionAt||s.createdAt)}</p><p>Customer: ${esc(customerName(s.customerId))}</p><div class="line"></div><table>${s.items.map(x=>`<tr><td>${esc(x.name)}<br><small>${x.qty} × ${money(x.price)}</small></td><td class="r">${money(x.qty*x.price)}</td></tr>`).join('')}</table><div class="line"></div><table><tr><td>Subtotal</td><td class="r">${money(s.subtotal)}</td></tr><tr><td>Discount</td><td class="r">${money(s.discount)}</td></tr><tr class="total"><td>Total</td><td class="r">${money(s.total)}</td></tr><tr><td>Paid</td><td class="r">${money(s.paid)}</td></tr><tr><td>Due</td><td class="r">${money(Math.max(0,s.total-s.paid))}</td></tr></table><div class="line"></div><p>ধন্যবাদ, আবার আসবেন।</p><script>window.onload=()=>window.print()<\/script>


</body></html>`);w.document.close()}

function addMonthsToDate(date,months){let d=new Date(date+'T00:00:00');let day=d.getDate();d.setMonth(d.getMonth()+Number(months||0));if(d.getDate()<day)d.setDate(0);return dateKey(d)}

function createIndustrySale({items,total,paid,customerId='',invoicePrefix='IND',note=''}){if(total<0||paid<0||paid>total)throw new Error('বিক্রির অঙ্ক যাচাই করুন।');if(paid<total&&!customerId)throw new Error('বাকি বিক্রির জন্য কাস্টমার নির্বাচন করুন।');let costTotal=items.reduce((a,x)=>a+Number(x.cost||0)*Number(x.qty||0),0);let sale={id:uid(),invoice:invoicePrefix+'-'+Date.now().toString().slice(-8),date:today(),createdAt:Date.now(),branchId:activeBranchId,employeeId:'',customerId,items:items.map(x=>({...x,lineTotal:Number(x.price)*Number(x.qty)})),subtotal:total,discount:0,total,paid,profit:Math.max(0,total-costTotal),costTotal,note};db.sales.push(sale);return sale}

/* ------------------------------------------------------------------
   Cash Loom launch-readiness upgrade
   Customer/supplier ledgers, invoice-level settlements, sale/purchase
   returns, multi-line purchases, account ledger, stock adjustments,
   safe archive/delete, expense edit/void, and stronger reporting.
------------------------------------------------------------------- */
let launchCustomerTab='list', launchSupplierTab='list', launchPurchaseTab='bills',
    launchSalesTab='all', launchShowArchivedCustomers=false, launchShowArchivedSuppliers=false,
    launchShowArchivedProducts=false, launchShowVoidedExpenses=false, launchShowArchivedEmployees=false;

function launchEnsureData(){
  db.saleReturns=Array.isArray(db.saleReturns)?db.saleReturns:[];
  db.purchaseReturns=Array.isArray(db.purchaseReturns)?db.purchaseReturns:[];
  db.moneyTransactions=Array.isArray(db.moneyTransactions)?db.moneyTransactions:[];
  db.auditLogs=Array.isArray(db.auditLogs)?db.auditLogs:[];
  db.stockAdjustments=Array.isArray(db.stockAdjustments)?db.stockAdjustments:[];
  db.customers=(db.customers||[]).map(x=>({...x,isActive:x.isActive!==false}));
  db.suppliers=(db.suppliers||[]).map(x=>({...x,isActive:x.isActive!==false}));
  db.products=(db.products||[]).map(x=>({...x,isActive:x.isActive!==false}));
  db.sales=(db.sales||[]).map(s=>({...s,paid:Number(s.paid||0),total:Number(s.total||0),paymentMethod:s.paymentMethod||'Cash'}));
  db.purchases=(db.purchases||[]).map(p=>({
    ...p,total:Number(p.total||0),paid:Number(p.paid||0),
    items:Array.isArray(p.items)&&p.items.length?p.items:(p.productId?[{
      productId:p.productId,name:p.productName||db.products.find(x=>x.id===p.productId)?.name||'পণ্য',
      qty:Number(p.qty||0),cost:Number(p.cost||0)
    }]:[])
  }));
  db.customerPayments=(db.customerPayments||[]).map(p=>({...p,status:p.status||'active',method:p.method||'Cash'}));
  db.supplierPayments=(db.supplierPayments||[]).map(p=>({...p,status:p.status||'active',method:p.method||'Cash'}));
  db.expenses=(db.expenses||[]).map(x=>({...x,status:x.status||'active'}));
  db.sales.forEach(s=>{if(!s.items)s.items=[]});
  if(!db.settings.accountOpeningBalances)db.settings.accountOpeningBalances={Cash:0,bKash:0,Nagad:0,Bank:0,Card:0,Other:0};
  if(!db.launchMoneyMigrationV1){
    const exists=k=>db.moneyTransactions.some(t=>t.sourceKey===k);
    const add=(key,sourceType,sourceId,branchId,method,amount,direction,date,note)=>{
      amount=Number(amount||0);if(!amount||exists(key))return;
      db.moneyTransactions.push({id:uid(),sourceKey:key,sourceType,sourceId,branchId:branchId||MAIN_BRANCH_ID,
        method:launchAccountName(method),signed:direction==='in'?amount:-amount,date:date||today(),note:note||'Legacy transaction',createdAt:Date.now(),status:'active'});
    };
    db.sales.forEach(s=>add('sale-paid:'+s.id,'sale-paid',s.id,s.branchId,s.paymentMethod,s.paid,'in',s.date,'Initial sale collection '+(s.invoice||'')));
    db.purchases.forEach(p=>add('purchase-paid:'+p.id,'purchase-paid',p.id,p.branchId,p.paymentMethod,p.paid,'out',p.date,'Initial purchase payment '+(p.invoice||'')));
    db.customerPayments.forEach(p=>add('customer-payment:'+p.id,'customer-payment',p.id,p.branchId,p.method,p.amount,'in',p.date,'Customer due collection'));
    db.supplierPayments.forEach(p=>add('supplier-payment:'+p.id,'supplier-payment',p.id,p.branchId,p.method,p.amount,'out',p.date,'Supplier payment'));
    db.expenses.filter(x=>x.status!=='void').forEach(x=>add('expense:'+x.id,'expense',x.id,x.branchId,x.method,x.amount,'out',x.date,x.title));
    db.launchMoneyMigrationV1=true;
  }
}
launchEnsureData();

function launchAccountName(method){
  const m=String(method||'Cash').toLowerCase();
  if(m.includes('bkash')||m.includes('বিকাশ'))return 'bKash';
  if(m.includes('nagad')||m.includes('নগদ'))return 'Nagad';
  if(m.includes('bank')||m.includes('ব্যাংক'))return 'Bank';
  if(m.includes('card')||m.includes('কার্ড'))return 'Card';
  if(m.includes('other')||m.includes('অন্যান্য'))return 'Other';
  return 'Cash';
}
function launchMoney(sourceType,sourceId,branchId,method,amount,direction,date,note){
  amount=Number(amount||0);if(!Number.isFinite(amount)||amount<=0)return null;
  const rec={id:uid(),sourceKey:sourceType+':'+sourceId+':'+uid(),sourceType,sourceId,branchId:branchId||activeBranchId,
    method:launchAccountName(method),signed:direction==='in'?amount:-amount,date:date||today(),note:String(note||''),createdAt:Date.now(),status:'active'};
  db.moneyTransactions.push(rec);return rec;
}
function launchAudit(action,entity,entityId,details=''){
  db.auditLogs.unshift({id:uid(),date:today(),createdAt:Date.now(),branchId:activeBranchId,action,entity,entityId,details:String(details||''),actor:db.settings.owner||'ব্যবহারকারী'});
  if(db.auditLogs.length>2000)db.auditLogs.length=2000;
}
function launchReverseMoney(sourceType,sourceId,reason){
  const originals=db.moneyTransactions.filter(t=>t.sourceType===sourceType&&t.sourceId===sourceId&&t.status!=='reversed');
  originals.forEach(t=>{
    t.status='reversed';
    const rev={id:uid(),sourceKey:'reverse:'+t.id,sourceType:'reversal',sourceId:t.id,branchId:t.branchId,
      method:t.method,signed:-Number(t.signed||0),date:today(),note:'Reversal: '+(reason||t.note||''),createdAt:Date.now(),status:'active'};
    db.moneyTransactions.push(rev);
  });
}
function launchSaleReturnTotal(saleId){return db.saleReturns.filter(r=>r.saleId===saleId&&r.status!=='void').reduce((a,r)=>a+Number(r.amount||0),0)}
function launchPurchaseReturnTotal(purchaseId){return db.purchaseReturns.filter(r=>r.purchaseId===purchaseId&&r.status!=='void').reduce((a,r)=>a+Number(r.amount||0),0)}
function launchPurchaseItems(p){
  if(Array.isArray(p.items)&&p.items.length)return p.items;
  if(p.productId)return [{productId:p.productId,name:p.productName||'পণ্য',qty:Number(p.qty||0),cost:Number(p.cost||0)}];
  return [];
}
function launchPurchaseTotal(p){return Number(p.total??launchPurchaseItems(p).reduce((a,x)=>a+Number(x.qty||0)*Number(x.cost||0),0))}
function launchSaleMap(customerId){
  const invoices=inBranch(db.sales).filter(s=>s.customerId===customerId).sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))||Number(a.createdAt||0)-Number(b.createdAt||0));
  const openingBalances=inBranch(db.customerOpeningBalances||[]).filter(x=>x.customerId===customerId&&x.status!=='void').sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))||Number(a.createdAt||0)-Number(b.createdAt||0));
  const remaining=new Map(),collected=new Map(),openingRemaining=new Map(),openingCollected=new Map();
  invoices.forEach(s=>{
    const net=Math.max(0,Number(s.total||0)-launchSaleReturnTotal(s.id));
    const basePaid=Math.min(net,Number(s.paid||0));
    remaining.set(s.id,Math.max(0,net-basePaid));collected.set(s.id,basePaid);
  });
  openingBalances.forEach(x=>{const total=Math.max(0,Number(x.total||0)),paid=Math.min(total,Math.max(0,Number(x.paid||0)));openingRemaining.set(x.id,Math.max(0,total-paid));openingCollected.set(x.id,paid)});
  const payments=inBranch(db.customerPayments).filter(p=>p.customerId===customerId&&p.status!=='void').sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))||Number(a.createdAt||0)-Number(b.createdAt||0));
  payments.forEach(p=>{
    let left=Number(p.amount||0);
    if(Array.isArray(p.allocations)&&p.allocations.length){
      p.allocations.forEach(al=>{
        const want=Number(al.amount||0);let cur=0,take=0;
        if(al.openingBalanceId){cur=Number(openingRemaining.get(al.openingBalanceId)||0);take=Math.max(0,Math.min(cur,want));if(take>0){openingRemaining.set(al.openingBalanceId,cur-take);openingCollected.set(al.openingBalanceId,Number(openingCollected.get(al.openingBalanceId)||0)+take)}}
        else{const sid=al.saleId;cur=Number(remaining.get(sid)||0);take=Math.max(0,Math.min(cur,want));if(take>0){remaining.set(sid,cur-take);collected.set(sid,Number(collected.get(sid)||0)+take)}}
        if(take>0)left-=take;
      });
    }else{
      invoices.forEach(s=>{if(left<=0)return;const cur=Number(remaining.get(s.id)||0),take=Math.min(cur,left);if(take>0){remaining.set(s.id,cur-take);collected.set(s.id,Number(collected.get(s.id)||0)+take);left-=take}});
      openingBalances.forEach(x=>{if(left<=0)return;const cur=Number(openingRemaining.get(x.id)||0),take=Math.min(cur,left);if(take>0){openingRemaining.set(x.id,cur-take);openingCollected.set(x.id,Number(openingCollected.get(x.id)||0)+take);left-=take}});
    }
  });
  return {invoices,remaining,collected,openingBalances,openingRemaining,openingCollected};
}
function launchPurchaseMap(supplierId){
  const invoices=inBranch(db.purchases).filter(p=>p.supplierId===supplierId).sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))||Number(a.createdAt||0)-Number(b.createdAt||0));
  const remaining=new Map(),paidMap=new Map();
  invoices.forEach(p=>{
    const net=Math.max(0,launchPurchaseTotal(p)-launchPurchaseReturnTotal(p.id));
    const basePaid=Math.min(net,Number(p.paid||0));
    remaining.set(p.id,Math.max(0,net-basePaid));paidMap.set(p.id,basePaid);
  });
  const payments=inBranch(db.supplierPayments).filter(p=>p.supplierId===supplierId&&p.status!=='void').sort((a,b)=>String(a.date||'').localeCompare(String(b.date||''))||Number(a.createdAt||0)-Number(b.createdAt||0));
  payments.forEach(p=>{
    let left=Number(p.amount||0);
    if(Array.isArray(p.allocations)&&p.allocations.length){
      p.allocations.forEach(al=>{
        const pid=al.purchaseId,cur=Number(remaining.get(pid)||0),want=Number(al.amount||0),take=Math.max(0,Math.min(cur,want));
        if(take>0){remaining.set(pid,cur-take);paidMap.set(pid,Number(paidMap.get(pid)||0)+take);left-=take}
      });
    }else{
      invoices.forEach(inv=>{if(left<=0)return;const cur=Number(remaining.get(inv.id)||0),take=Math.min(cur,left);if(take>0){remaining.set(inv.id,cur-take);paidMap.set(inv.id,Number(paidMap.get(inv.id)||0)+take);left-=take}});
    }
  });
  return {invoices,remaining,paidMap};
}
function launchCustomerDue(id){const m=launchSaleMap(id);return [...m.remaining.values()].reduce((a,x)=>a+Number(x||0),0)+[...m.openingRemaining.values()].reduce((a,x)=>a+Number(x||0),0)}
function launchSupplierDue(id){const m=launchPurchaseMap(id);return [...m.remaining.values()].reduce((a,x)=>a+Number(x||0),0)}
function launchSaleDue(sale){const m=launchSaleMap(sale.customerId);return m.remaining.has(sale.id)?Number(m.remaining.get(sale.id)||0):Math.max(0,Number(sale.total||0)-Number(sale.paid||0)-launchSaleReturnTotal(sale.id))}
function launchSalePaid(sale){const m=launchSaleMap(sale.customerId);return Number(m.collected.get(sale.id)||Math.min(Number(sale.total||0)-launchSaleReturnTotal(sale.id),Number(sale.paid||0)))}
function launchPurchaseDue(p){if(!p.supplierId)return Math.max(0,launchPurchaseTotal(p)-Number(p.paid||0)-launchPurchaseReturnTotal(p.id));return Number(launchPurchaseMap(p.supplierId).remaining.get(p.id)||0)}
function launchPurchasePaid(p){if(!p.supplierId)return Math.min(launchPurchaseTotal(p),Number(p.paid||0));const m=launchPurchaseMap(p.supplierId);return Number(m.paidMap.get(p.id)||p.paid||0)}
function launchInvoiceStatus(due,paid){return due<=0?'পরিশোধিত':paid>0?'আংশিক পরিশোধ':'পরিশোধ হয়নি'}
function launchStatusBadge(due,paid){const cls=due<=0?'':paid>0?'warn':'danger';return `<span class="badge ${cls}">${launchInvoiceStatus(due,paid)}</span>`}
function launchOpenSaleAllocations(customerId,amount){
  const m=launchSaleMap(customerId);let left=Number(amount),out=[];
  m.invoices.forEach(s=>{if(left<=0)return;const due=Number(m.remaining.get(s.id)||0),take=Math.min(due,left);if(take>0){out.push({saleId:s.id,invoice:s.invoice,amount:Number(take.toFixed(2))});left-=take}});
  (m.openingBalances||[]).forEach(x=>{if(left<=0)return;const due=Number(m.openingRemaining.get(x.id)||0),take=Math.min(due,left);if(take>0){out.push({openingBalanceId:x.id,invoice:x.reference||'প্রাথমিক বাকি',amount:Number(take.toFixed(2))});left-=take}});
  if(left>0.009)throw new Error('কাস্টমারের বকেয়া পরিবর্তিত হয়েছে। আবার চেষ্টা করুন।');
  return out;
}
function launchOpenPurchaseAllocations(supplierId,amount){
  const m=launchPurchaseMap(supplierId);let left=Number(amount),out=[];
  m.invoices.forEach(p=>{if(left<=0)return;const due=Number(m.remaining.get(p.id)||0),take=Math.min(due,left);if(take>0){out.push({purchaseId:p.id,invoice:p.invoice,amount:Number(take.toFixed(2))});left-=take}});
  if(left>0.009)throw new Error('সাপ্লায়ারের পাওনা পরিবর্তিত হয়েছে। আবার চেষ্টা করুন।');
  return out;
}

  if(kind==='supplier')linked=db.purchases.some(p=>p.supplierId===id)||db.supplierPayments.some(p=>p.supplierId===id)||db.purchaseReturns.some(r=>r.supplierId===id);
  if(kind==='product')linked=db.sales.some(s=>(s.items||[]).some(i=>i.id===id||i.productId===id))||db.purchases.some(p=>launchPurchaseItems(p).some(i=>i.productId===id))||db.onlineOrders.some(o=>(o.items||[]).some(i=>i.productId===id))||db.industryRecords.stockLots.some(x=>x.productId===id)||db.industryRecords.variants.some(x=>x.productId===id);

    if(!confirm(`${kind==='customer'?'কাস্টমার':kind==='supplier'?'সাপ্লায়ার':'পণ্য'}-এর লেনদেনের ইতিহাস আছে। Delete না করে Archive করবেন?`))return;
    obj.isActive=false;obj.archivedAt=Date.now();launchAudit('archive',kind,id,obj.name||obj.id);save();render();toast('রেকর্ড Archive হয়েছে; পুরোনো লেনদেন অক্ষত আছে।');return;
  }
  if(!confirm('এই রেকর্ড স্থায়ীভাবে মুছে ফেলবেন?'))return;
  const index=collection.findIndex(x=>x.id===id);if(index>=0)collection.splice(index,1);
  launchAudit('delete',kind,id,obj.name||obj.id);save();render();toast('রেকর্ড মুছে ফেলা হয়েছে।');

function launchInvoiceRows(type,tab){
 const isC=type==='customer';
 if(tab==='cash'&&!isC)return '';
 if(tab==='collections'&&isC)return '';
 if(tab==='payments'&&!isC)return '';
 if(tab==='returns'&&!isC)return '';
 const arr=isC?inBranch(db.sales):inBranch(db.purchases);
 const rows=arr.slice().sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0)).filter(x=>{
   if(tab==='cash')return x.saleType==='cash'||(x.saleType==null&&!x.customerId&&launchSaleDue(x)<=0);
   if(tab==='returns')return false;
   if(tab==='collections'||tab==='payments')return false;
   if(tab==='list')return false;
   const due=isC?launchSaleDue(x):launchPurchaseDue(x),paid=isC?launchSalePaid(x):launchPurchasePaid(x);
   if(tab==='unpaid')return due>0&&paid<=0;
   if(tab==='partial')return due>0&&paid>0;
   if(tab==='paid')return due<=0;
   return true;
 });
 const invoiceRows=rows.map(x=>{
   const due=isC?launchSaleDue(x):launchPurchaseDue(x),paid=isC?launchSalePaid(x):launchPurchasePaid(x),net=isC?Math.max(0,x.total-launchSaleReturnTotal(x.id)):Math.max(0,launchPurchaseTotal(x)-launchPurchaseReturnTotal(x.id));
   const party=isC?customerName(x.customerId):supplierName(x.supplierId);
   const action=isC?`<button class="btn small" data-action="print-sale" data-id="${x.id}">রসিদ</button> <button class="btn small" data-launch-action="sale-return" data-id="${x.id}">রিটার্ন</button> ${due>0?`<button class="btn small primary" data-launch-action="collect-customer" data-id="${x.customerId}">আদায়</button>`:''}`:
   `<button class="btn small" data-launch-action="purchase-detail" data-id="${x.id}">বিস্তারিত</button> <button class="btn small" data-launch-action="purchase-return" data-id="${x.id}">ক্রয় ফেরত</button>`;
   const itemSummary=isC?(x.items||[]).map(i=>`${i.name} × ${i.qty}`).join(', '):launchPurchaseItems(x).map(i=>`${i.name} × ${i.qty}`).join(', ');
   return `<tr><td><div class="table-title">${esc(x.invoice||'—')}</div><div class="table-sub cl-datetime-sub">${fmtDate(x.date)} · ${fmtTime(x.transactionAt||x.createdAt)}</div></td><td>${esc(party)}</td><td class="order-item-summary">${esc(itemSummary)}</td><td>${money(net)}</td><td>${money(paid)}</td><td>${esc(isC?(x.paymentMethod||'Cash'):(x.paymentMethod||'Cash'))}</td><td><b class="${due?'negative':'positive'}">${money(due)}</b></td><td>${launchStatusBadge(due,paid)}</td><td><div class="order-actions">${action}</div></td></tr>`;
 }).join('');
 const openingRows=isC&&['all','unpaid','partial','paid'].includes(tab)?inBranch(db.customerOpeningBalances||[]).filter(x=>x.status!=='void').map(x=>{
   const m=launchSaleMap(x.customerId),due=Number(m.openingRemaining.get(x.id)||0),paid=Number(m.openingCollected.get(x.id)||0);
   const keep=tab==='all'||(tab==='unpaid'&&due>0&&paid<=0)||(tab==='partial'&&due>0&&paid>0)||(tab==='paid'&&due<=0);
   if(!keep)return '';
   const customer=db.customers.find(c=>c.id===x.customerId),action=due>0?`<button class="btn small primary" data-launch-action="collect-customer" data-id="${x.customerId}">আদায়</button>`:'—';
   return `<tr><td><div class="table-title">${esc(x.reference||'প্রাথমিক হিসাব')}</div><div class="table-sub cl-datetime-sub">${fmtDate(x.date)} · ${fmtTime(x.transactionAt||x.createdAt)} · প্রাথমিক হিসাব</div></td><td>${esc(customer?.name||'কাস্টমার')}</td><td class="order-item-summary">${esc(x.note||'প্রাথমিক লেনদেন')}</td><td>${money(x.total)}</td><td>${money(paid)}</td><td>${esc(x.method||'Cash')}</td><td><b class="${due?'negative':'positive'}">${money(due)}</b></td><td>${launchStatusBadge(due,paid)}</td><td><div class="order-actions">${action}</div></td></tr>`;
 }).join(''):'';
 return invoiceRows+openingRows;
}

 });
}

function consumeIndustryLots(productId,qty){
 const records=db.industryRecords?.stockLots||[],kind=['pharmacy','grocery'].includes(db.settings.industryType)?db.settings.industryType:null;if(!kind)return [];
 const lots=records.filter(l=>l.kind===kind&&l.branchId===activeBranchId&&l.productId===productId&&Number(l.qtyRemaining)>0&&l.expiry>=today()).sort((a,b)=>String(a.expiry||'9999').localeCompare(String(b.expiry||'9999')));let left=qty,alloc=[];
 for(const lot of lots){if(left<=0)break;const take=Math.min(left,Number(lot.qtyRemaining));if(take>0){lot.qtyRemaining-=take;left-=take;alloc.push({lotId:lot.id,qty:take})}}
 if(left>0.0001&&lots.length)throw new Error('Batch Stock অপর্যাপ্ত।');
 return alloc;
}
